<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrillMaster — De Werkplaats Missie</title>
<style>
  :root {
    --bg: #0a0a0f;
    --bg2: #111118;
    --bg3: #1a1a24;
    --teal: #00e5cc;
    --pink: #e500a4;
    --purple: #7c3aed;
    --gold: #f59e0b;
    --red: #ef4444;
    --orange: #f97316;
    --green: #10b981;
    --text: #e2e8f0;
    --muted: #64748b;
    --border: #2d2d3d;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; overflow-x:hidden; }

  /* SPLASH */
  #splash { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:2rem; background: radial-gradient(ellipse at center, #1a0a2e 0%, var(--bg) 70%); }
  .splash-logo { font-size:3rem; font-weight:900; letter-spacing:0.1em; color:var(--teal); text-shadow:0 0 30px var(--teal); margin-bottom:0.5rem; }
  .splash-sub { color:var(--muted); font-size:1rem; letter-spacing:0.2em; text-transform:uppercase; margin-bottom:3rem; }
  .splash-card { background:var(--bg2); border:1px solid var(--border); border-radius:1rem; padding:2.5rem; width:100%; max-width:420px; }
  .splash-card h2 { font-size:1.5rem; margin-bottom:2rem; text-align:center; }
  .form-group { margin-bottom:1.5rem; }
  .form-group label { display:block; font-size:0.75rem; letter-spacing:0.15em; text-transform:uppercase; color:var(--muted); margin-bottom:0.5rem; }
  .form-group input { width:100%; background:var(--bg3); border:1px solid var(--border); border-radius:0.5rem; padding:0.75rem 1rem; color:var(--text); font-size:1rem; outline:none; transition:border-color 0.2s; }
  .form-group input:focus { border-color:var(--teal); }
  .btn-start { width:100%; background:linear-gradient(135deg,var(--teal),var(--purple)); border:none; border-radius:0.5rem; padding:1rem; color:#fff; font-size:1.1rem; font-weight:700; letter-spacing:0.1em; cursor:pointer; transition:opacity 0.2s,transform 0.1s; }
  .btn-start:hover { opacity:0.9; transform:translateY(-1px); }
  .splash-stats { display:flex; gap:2rem; margin-top:2rem; justify-content:center; color:var(--muted); font-size:0.85rem; }

  /* HUD */
  #game { display:none; min-height:100vh; }
  .hud { position:sticky; top:0; z-index:100; background:rgba(10,10,15,0.95); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); padding:0.75rem 1.5rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
  .hud-brand { font-weight:900; font-size:1.1rem; color:var(--teal); letter-spacing:0.05em; }
  .hud-hearts { display:flex; gap:0.3rem; font-size:1.4rem; }
  .heart { transition:all 0.3s; }
  .heart.lost { filter:grayscale(1); opacity:0.3; }
  .hud-xp { background:var(--bg3); border:1px solid var(--border); border-radius:2rem; padding:0.3rem 0.8rem; font-size:0.85rem; color:var(--gold); font-weight:700; }
  .hud-progress { font-size:0.8rem; color:var(--muted); }
  .hud-user { font-size:0.8rem; color:var(--muted); }

  /* SCENE */
  .scene-wrap { max-width:900px; margin:0 auto; padding:2rem 1rem; }
  .scene-img { width:100%; border-radius:1rem; margin-bottom:1.5rem; border:1px solid var(--border); max-height:400px; object-fit:cover; }
  .scene-badge { display:inline-block; font-size:0.7rem; letter-spacing:0.15em; text-transform:uppercase; padding:0.25rem 0.75rem; border-radius:2rem; margin-bottom:0.75rem; font-weight:700; }
  .badge-intro { background:rgba(0,229,204,0.15); color:var(--teal); border:1px solid var(--teal); }
  .badge-choice { background:rgba(124,58,237,0.15); color:#a78bfa; border:1px solid #7c3aed; }
  .badge-danger { background:rgba(239,68,68,0.15); color:var(--red); border:1px solid var(--red); }
  .badge-impact { background:rgba(249,115,22,0.15); color:var(--orange); border:1px solid var(--orange); }
  .badge-recovery { background:rgba(245,158,11,0.15); color:var(--gold); border:1px solid var(--gold); }
  .badge-mentor { background:rgba(16,185,129,0.15); color:var(--green); border:1px solid var(--green); }
  .badge-success { background:rgba(16,185,129,0.2); color:var(--green); border:1px solid var(--green); }
  .badge-boss { background:rgba(229,0,164,0.15); color:var(--pink); border:1px solid var(--pink); }
  .scene-title { font-size:1.5rem; font-weight:800; margin-bottom:0.25rem; }
  .scene-subtitle { font-size:0.85rem; color:var(--muted); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:1rem; }
  .scene-text { font-size:1.05rem; line-height:1.8; color:#cbd5e1; margin-bottom:1.5rem; }
  .voice-btn { background:var(--bg3); border:1px solid var(--border); border-radius:0.5rem; padding:0.5rem 1rem; color:var(--teal); font-size:0.85rem; cursor:pointer; margin-bottom:1.5rem; transition:background 0.2s; }
  .voice-btn:hover { background:var(--border); }
  .choices-label { font-size:0.75rem; letter-spacing:0.15em; text-transform:uppercase; color:var(--muted); margin-bottom:0.75rem; }
  .choices { display:flex; flex-direction:column; gap:0.75rem; }
  .choice-btn { background:var(--bg2); border:1px solid var(--border); border-radius:0.75rem; padding:1rem 1.25rem; text-align:left; color:var(--text); font-size:0.95rem; cursor:pointer; transition:all 0.2s; display:flex; align-items:flex-start; gap:0.75rem; }
  .choice-btn:hover { border-color:var(--teal); background:rgba(0,229,204,0.05); transform:translateX(4px); }
  .choice-letter { font-weight:900; color:var(--teal); font-size:1rem; min-width:1.5rem; }

  /* CONSEQUENCE PANEL */
  .consequence { border-radius:0.75rem; padding:1.25rem; margin-bottom:1.5rem; border-left:4px solid; }
  .consequence.klein { background:rgba(249,115,22,0.1); border-color:var(--orange); }
  .consequence.groot { background:rgba(239,68,68,0.1); border-color:var(--red); }
  .consequence.mentor { background:rgba(16,185,129,0.1); border-color:var(--green); }
  .consequence-title { font-weight:700; margin-bottom:0.5rem; font-size:0.9rem; letter-spacing:0.05em; }
  .consequence.klein .consequence-title { color:var(--orange); }
  .consequence.groot .consequence-title { color:var(--red); }
  .consequence.mentor .consequence-title { color:var(--green); }
  .consequence-text { font-size:0.9rem; line-height:1.6; color:#94a3b8; }
  .btn-continue { background:linear-gradient(135deg,var(--teal),var(--purple)); border:none; border-radius:0.5rem; padding:0.75rem 2rem; color:#fff; font-weight:700; cursor:pointer; font-size:0.95rem; margin-top:0.75rem; transition:opacity 0.2s; }
  .btn-continue:hover { opacity:0.85; }

  /* GAME OVER */
  #gameover { display:none; min-height:100vh; align-items:center; justify-content:center; flex-direction:column; padding:2rem; background:radial-gradient(ellipse at center, #2d0a0a 0%, var(--bg) 70%); }
  .go-img { width:100%; max-width:600px; border-radius:1rem; margin-bottom:2rem; }
  .go-title { font-size:3rem; font-weight:900; color:var(--red); text-shadow:0 0 40px var(--red); margin-bottom:1rem; text-align:center; }
  .go-stats { background:var(--bg2); border:1px solid var(--border); border-radius:1rem; padding:1.5rem; max-width:400px; width:100%; margin-bottom:1.5rem; }
  .go-stat { display:flex; justify-content:space-between; padding:0.5rem 0; border-bottom:1px solid var(--border); font-size:0.9rem; }
  .go-stat:last-child { border-bottom:none; }
  .btn-restart { background:var(--red); border:none; border-radius:0.5rem; padding:0.75rem 2rem; color:#fff; font-weight:700; cursor:pointer; font-size:1rem; }

  /* WIN */
  #winscreen { display:none; min-height:100vh; align-items:center; justify-content:center; flex-direction:column; padding:2rem; background:radial-gradient(ellipse at center, #0a2d1a 0%, var(--bg) 70%); }
  .win-img { width:100%; max-width:600px; border-radius:1rem; margin-bottom:2rem; }
  .win-title { font-size:3rem; font-weight:900; color:var(--teal); text-shadow:0 0 40px var(--teal); margin-bottom:0.5rem; text-align:center; }
  .win-score { font-size:4rem; font-weight:900; color:var(--gold); margin:1rem 0; }
  .win-stats { background:var(--bg2); border:1px solid var(--border); border-radius:1rem; padding:1.5rem; max-width:400px; width:100%; margin-bottom:1.5rem; }
  .win-stat { display:flex; justify-content:space-between; padding:0.5rem 0; border-bottom:1px solid var(--border); font-size:0.9rem; }
  .win-stat:last-child { border-bottom:none; }
  .btn-replay { background:linear-gradient(135deg,var(--teal),var(--purple)); border:none; border-radius:0.5rem; padding:0.75rem 2rem; color:#fff; font-weight:700; cursor:pointer; font-size:1rem; }

  /* PROGRESS BAR */
  .progress-bar-wrap { background:var(--bg3); border-radius:2rem; height:6px; margin-bottom:1.5rem; overflow:hidden; }
  .progress-bar { height:100%; background:linear-gradient(90deg,var(--teal),var(--purple)); border-radius:2rem; transition:width 0.5s ease; }

  /* MILAN QUOTE */
  .milan-quote { background:rgba(124,58,237,0.1); border:1px solid var(--purple); border-radius:0.75rem; padding:1rem 1.25rem; margin-bottom:1rem; font-style:italic; color:#a78bfa; font-size:0.95rem; }
  .milan-quote::before { content:'"'; font-size:1.5rem; line-height:0; vertical-align:-0.4em; margin-right:0.25rem; }
  .milan-quote::after { content:'"'; font-size:1.5rem; line-height:0; vertical-align:-0.4em; margin-left:0.25rem; }
  .milan-name { font-size:0.75rem; color:var(--muted); margin-top:0.5rem; font-style:normal; letter-spacing:0.1em; text-transform:uppercase; }

  @media(max-width:600px) {
    .splash-logo { font-size:2rem; }
    .scene-title { font-size:1.2rem; }
    .hud { padding:0.5rem 1rem; }
  }
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-logo">⚡ DrillMaster</div>
  <div class="splash-sub">De Werkplaats Missie · Logic Connections</div>
  <div class="splash-card">
    <h2>🎮 Start de Missie</h2>
    <div class="form-group">
      <label>Jouw naam</label>
      <input type="text" id="input-naam" placeholder="Voornaam Achternaam" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Jouw klas</label>
      <input type="text" id="input-klas" placeholder="bv. 2B, 3ME..." autocomplete="off">
    </div>
    <button class="btn-start" onclick="startGame()">⚡ Start de Missie</button>
  </div>
  <div class="splash-stats">
    <span>❤️❤️❤️ 3 hartjes</span>
    <span>📋 17 stappen</span>
    <span>⚠️ Echte gevolgen</span>
  </div>
</div>

<!-- GAME -->
<div id="game">
  <div class="hud">
    <div class="hud-brand">⚡ DrillMaster</div>
    <div class="hud-hearts" id="hud-hearts">❤️❤️❤️</div>
    <div class="hud-xp" id="hud-xp">⚡ 0 XP</div>
    <div class="hud-progress" id="hud-progress">Scene 1 / 17</div>
    <div class="hud-user" id="hud-user"></div>
  </div>
  <div class="scene-wrap">
    <div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>
    <div id="scene-content"></div>
  </div>
</div>

<!-- GAME OVER -->
<div id="gameover" style="display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;background:radial-gradient(ellipse at center,#2d0a0a 0%,#0a0a0f 70%);">
  <img src="images/gameover_screen.png" class="go-img" alt="Game Over">
  <div class="go-title">GAME OVER</div>
  <div class="go-stats" id="go-stats"></div>
  <button class="btn-restart" onclick="restartGame()">🔄 Opnieuw proberen</button>
</div>

<!-- WIN -->
<div id="winscreen" style="display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;background:radial-gradient(ellipse at center,#0a2d1a 0%,#0a0a0f 70%);">
  <img src="images/win_screen.png" class="win-img" alt="Victory">
  <div class="win-title">MISSIE VOLTOOID!</div>
  <div class="win-score" id="win-grade"></div>
  <div class="win-stats" id="win-stats"></div>
  <button class="btn-replay" onclick="restartGame()">🔄 Opnieuw spelen</button>
</div>

<script>
// ============================================================
// GAME STATE
// ============================================================
let STATE = {
  naam: '', klas: '',
  hearts: 3, xp: 0,
  sceneIndex: 0,
  fouten: 0, grootFouten: 0, consecutiveGroot: 0,
  totalScenes: 17,
  showingConsequence: false,
  pendingScene: null
};

// ============================================================
// SCENE DATA — 17 stappen, volledige workflow
// ============================================================
const SCENES = [
  // SCENE 1 — Opdracht begrijpen
  {
    id: 1,
    title: "Opdracht begrijpen",
    subtitle: "Stap 1 van 17 — De briefing",
    badge: "intro_scene",
    img: "images/s01_opdracht_intro.png",
    text: `Juan staat aan de instructietafel. De leerkracht deelt de werkbonnen uit en wijst naar het bord: <strong>S235 platstaal, lengte 120 mm, gat Ø10 mm op 60 mm van de rand.</strong> Er hangt een technische tekening aan het bord. Milan pakt zijn bon al op en loopt weg. "Ik snap het al, laten we gaan," zegt hij.`,
    milanQuote: null,
    vraag: "Wat doet Juan?",
    choices: [
      { letter:"A", text:"Juan leest de werkbon grondig, bekijkt de tekening en noteert de maten.", correct:true },
      { letter:"B", text:"Juan volgt Milan en gaat direct naar het materiaalrek zonder de bon te lezen.", correct:false, type:"klein", consequence:"Juan staat aan het materiaalrek maar weet niet welk materiaal hij nodig heeft. De leerkracht stuurt hem terug. \"Lees eerst je werkbon. Altijd.\"" },
      { letter:"C", text:"Juan leest alleen de maten maar bekijkt de tekening niet.", correct:false, type:"klein", consequence:"Juan kiest het juiste materiaal maar zaagt het op de verkeerde lengte omdat hij de tekening niet bekeek. Het stuk is afgekeurd." }
    ]
  },
  // SCENE 2 — PBM-check
  {
    id: 2,
    title: "PBM-check",
    subtitle: "Stap 2 van 17 — Persoonlijke beschermingsmiddelen",
    badge: "choice_scene",
    img: "images/s02_pbm_choice.png",
    text: `Juan staat aan de deur van de werkplaats. Zijn overall heeft hij aan. Zijn <strong>veiligheidsbril en oordoppen</strong> liggen nog in zijn locker. Milan roept vanuit de werkplaats: <em>"Kom op Juan, we hebben maar een uur! Ik ben al begonnen."</em>`,
    milanQuote: "Kom op Juan, we hebben maar een uur! Ik ben al begonnen.",
    vraag: "Wat doet Juan?",
    choices: [
      { letter:"A", text:"Juan haalt zijn bril en oordoppen, zet ze op en stapt dan de werkplaats in.", correct:true },
      { letter:"B", text:"Juan rent naar binnen zonder bril. \"Het is maar even.\"", correct:false, type:"groot", consequence:"Een metaalspaander springt recht op Juan af. Zonder bril raakt hij zijn oog. De leerkracht schakelt alles uit. EHBO. Dit had permanent oogletsel kunnen zijn. 2 hartjes weg." },
      { letter:"C", text:"Juan doet alleen zijn bril op maar vergeet de oordoppen. \"De zaagmachine maakt toch niet veel lawaai.\"", correct:false, type:"klein", consequence:"Na 10 minuten zagen heeft Juan oorsuizen. De leerkracht stuurt hem naar buiten. \"Gehoorbescherming is niet optioneel.\"" }
    ]
  },
  // SCENE 3 — Plan lezen
  {
    id: 3,
    title: "Plan lezen",
    subtitle: "Stap 3 van 17 — Technische tekening",
    badge: "choice_scene",
    img: "images/s03_plan_lezen.png",
    text: `Juan staat aan de werktafel en bekijkt de technische tekening. Op het plan staat: <strong>S235 platstaal, lengte 120 mm, gat Ø10 mm, centerpunt op 60 mm van de rand.</strong> Milan kijkt mee over zijn schouder.`,
    milanQuote: "Dat gat zit toch gewoon in het midden? Gewoon op gevoel.",
    vraag: "Wat doet Juan?",
    choices: [
      { letter:"A", text:"Juan leest de maten exact af en noteert: 120 mm lang, gat op 60 mm van de rand.", correct:true },
      { letter:"B", text:"Juan vertrouwt Milan en schat \"het midden\" zonder te meten.", correct:false, type:"klein", consequence:"Het gat zit 5 mm naast het midden. Het werkstuk is afgekeurd. Opnieuw beginnen." },
      { letter:"C", text:"Juan leest de lengte maar vergeet de positie van het gat te noteren.", correct:false, type:"klein", consequence:"Juan vergeet de positie en moet later opnieuw het plan raadplegen. Tijdverlies en verwarring." }
    ]
  },
  // SCENE 4 — Materiaal zoeken
  {
    id: 4,
    title: "Materiaal zoeken",
    subtitle: "Stap 4 van 17 — Het materiaalrek",
    badge: "choice_scene",
    img: "images/s04_materiaal_choice.png",
    text: `Juan staat aan het materiaalrek. Op het plan staat: <strong>S235 platstaal</strong>. In het rek liggen S235 platstaal, een aluminium strip, een inox plaat, en een oud stuk zonder label. Milan wijst naar het oude stuk.`,
    milanQuote: "Pak gewoon dat stuk. Dat ligt dichterbij en zagen gaat sneller.",
    vraag: "Wat doet Juan?",
    choices: [
      { letter:"A", text:"Juan neemt S235 platstaal en controleert het label.", correct:true },
      { letter:"B", text:"Juan neemt het oude stuk zonder label.", correct:false, type:"klein", consequence:"Het stuk blijkt hardox staal — veel te hard voor de boor. De boor breekt af bij het boren. Nieuw materiaal nodig." },
      { letter:"C", text:"Juan neemt aluminium omdat dat makkelijker zaagt.", correct:false, type:"klein", consequence:"Aluminium heeft andere eigenschappen dan S235. De opdracht vraagt staal. Het werkstuk is afgekeurd." }
    ]
  },
  // SCENE 5 — Materiaal controleren
  {
    id: 5,
    title: "Materiaal controleren",
    subtitle: "Stap 5 van 17 — Visuele inspectie",
    badge: "choice_scene",
    img: "images/s05_materiaal_check.png",
    text: `Juan heeft het S235 platstaal. Voor hij gaat zagen, inspecteert hij het materiaal. Hij ziet een <strong>kleine barst aan de rand</strong>. Milan kijkt toe.`,
    milanQuote: "Dat is maar een krasje, dat merk je niet.",
    vraag: "Wat doet Juan?",
    choices: [
      { letter:"A", text:"Juan meldt de barst aan de leerkracht en vraagt een nieuw stuk.", correct:true },
      { letter:"B", text:"Juan zaagt het stuk toch, de barst zit aan de rand die hij toch wegzaagt.", correct:false, type:"klein", consequence:"De barst zit net iets verder dan verwacht. Het stuk breekt tijdens het zagen. Nieuw materiaal nodig." },
      { letter:"C", text:"Juan negeert de barst volledig.", correct:false, type:"groot", consequence:"Het stuk breekt tijdens het boren. Een scherp stuk staal schiet weg. Gevaarlijk voor Juan en omstaanders." }
    ]
  },
  // SCENE 6 — Zaagmachine instellen
  {
    id: 6,
    title: "Zaagmachine instellen",
    subtitle: "Stap 6 van 17 — Lintzaagmachine",
    badge: "danger_closeup",
    img: "images/s06_zaag_instellen.png",
    text: `Juan staat bij de lintzaagmachine. Hij moet het S235 platstaal op <strong>120 mm</strong> zagen. De vorige leerling liet de machine op de <strong>hoogste snelheid</strong> staan (instelling voor aluminium) en de aanslag staat op <strong>100 mm</strong>. Een leerling loopt weg van de machine.`,
    milanQuote: "Laat die instellingen maar staan, dat zaagt sneller.",
    vraag: "Wat doet Juan?",
    choices: [
      { letter:"A", text:"Juan past de snelheid aan voor staal en stelt de aanslag correct in op 120 mm.", correct:true },
      { letter:"B", text:"Juan laat de snelheid hoog staan maar past de aanslag aan.", correct:false, type:"klein", consequence:"De zaagband slijt snel door de te hoge snelheid op staal. De band breekt. Machine stilgelegd." },
      { letter:"C", text:"Juan zaagt direct zonder iets aan te passen.", correct:false, type:"groot", consequence:"De zaagband breekt bij de eerste aanraking. Een stuk band schiet weg. Gevaar voor omstaanders. Machine stilgelegd." }
    ]
  },
  // SCENE 7 — Zagen
  {
    id: 7,
    title: "Zagen",
    subtitle: "Stap 7 van 17 — Lintzaagmachine in werking",
    badge: "danger_closeup",
    img: "images/s07_zagen_danger.png",
    text: `De zaagmachine is correct ingesteld. Juan legt het S235 platstaal in de klem. Milan loopt langs en tikt op zijn schouder. Juan is afgeleid. <strong>De klem is nog niet vastgedraaid.</strong>`,
    milanQuote: "Hé, heb je die nieuwe game al gezien?",
    vraag: "Wat doet Juan?",
    choices: [
      { letter:"A", text:"Juan negeert Milan, draait de klem stevig vast en start dan de zaag.", correct:true },
      { letter:"B", text:"Juan start de zaag terwijl hij half naar Milan luistert, klem niet vast.", correct:false, type:"groot", consequence:"Het materiaal draait mee met de zaagband. Het schiet van de tafel. Bijna-ongeluk. Machine stilgelegd." },
      { letter:"C", text:"Juan houdt het materiaal met de hand vast. \"Het is maar een klein stukje.\"", correct:false, type:"groot", consequence:"De zaag grijpt het materiaal. Juan trekt zijn hand terug maar de zaag raakt zijn vingers. Ambulance gebeld." }
    ]
  },
  // SCENE 8 — Ontbramen
  {
    id: 8,
    title: "Ontbramen",
    subtitle: "Stap 8 van 17 — Bramen verwijderen",
    badge: "impact_scene",
    img: "images/s08_ontbramen_impact.png",
    text: `Juan houdt het gezaagde stuk van 120 mm vast. De randen zijn <strong>scherp en vol bramen</strong>. Een leerling naast hem trekt snel een braam weg met zijn blote vingers.`,
    milanQuote: "Zie je, gaat veel sneller dan vijlen.",

// ============================================================
// GAME LOGIC
// ============================================================
function startGame() {
  const naam = document.getElementById('input-naam').value.trim();
  const klas = document.getElementById('input-klas').value.trim();
  if (!naam) { document.getElementById('input-naam').focus(); return; }
  STATE.naam = naam;
  STATE.klas = klas || '—';
  STATE.hearts = 3; STATE.xp = 0; STATE.sceneIndex = 0;
  STATE.fouten = 0; STATE.grootFouten = 0; STATE.consecutiveGroot = 0;
  document.getElementById('splash').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  document.getElementById('hud-user').textContent = naam + ' · ' + STATE.klas;
  renderScene();
}

function renderScene() {
  const scene = SCENES[STATE.sceneIndex];
  updateHUD();
  const badgeLabels = {
    intro_scene:'🎬 Intro', choice_scene:'🎯 Keuze', danger_closeup:'⚠️ Gevaar',
    impact_scene:'💥 Impact', recovery_scene:'🔄 Herstel', mentor_scene:'👨‍🏫 Mentor',
    success_scene:'✅ Succes', boss_gate_scene:'🔒 Boss Gate'
  };
  const badgeClasses = {
    intro_scene:'badge-intro', choice_scene:'badge-choice', danger_closeup:'badge-danger',
    impact_scene:'badge-impact', recovery_scene:'badge-recovery', mentor_scene:'badge-mentor',
    success_scene:'badge-success', boss_gate_scene:'badge-boss'
  };

  let milanHTML = '';
  if (scene.milanQuote) {
    milanHTML = `<div class="milan-quote">${scene.milanQuote}<div class="milan-name">— Milan</div></div>`;
  }

  let choicesHTML = scene.choices.map(c => `
    <button class="choice-btn" onclick="handleChoice(${scene.choices.indexOf(c)})">
      <span class="choice-letter">${c.letter}</span>
      <span>${c.text}</span>
    </button>`).join('');

  document.getElementById('scene-content').innerHTML = `
    <img src="${scene.img}" class="scene-img" alt="${scene.title}" onerror="this.style.display='none'">
    <span class="scene-badge ${badgeClasses[scene.badge]}">${badgeLabels[scene.badge]}</span>
    <div class="scene-title">${scene.title}</div>
    <div class="scene-subtitle">${scene.subtitle}</div>
    <div class="scene-text">${scene.text}</div>
    ${milanHTML}
    <button class="voice-btn" onclick="speakScene()">🔊 Voorlezen</button>
    <div class="choices-label">Wat kiest hij nu?</div>
    <div class="choices">${choicesHTML}</div>
  `;
  window.scrollTo(0,0);
}

function handleChoice(idx) {
  const scene = SCENES[STATE.sceneIndex];
  const choice = scene.choices[idx];

  if (choice.correct) {
    STATE.xp += 50;
    STATE.consecutiveGroot = 0;
    // Show brief success flash then advance
    const content = document.getElementById('scene-content');
    const successDiv = document.createElement('div');
    successDiv.className = 'consequence mentor';
    successDiv.innerHTML = `<div class="consequence-title">✅ Juiste keuze! +50 XP</div><div class="consequence-text">Goed gedaan. Juan doet het correct.</div><button class="btn-continue" onclick="advanceScene()">→ Volgende stap</button>`;
    // Disable choice buttons
    document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
    content.appendChild(successDiv);
    successDiv.scrollIntoView({behavior:'smooth', block:'nearest'});
  } else {
    // Wrong choice
    const type = choice.type || 'klein';
    if (type === 'groot') {
      STATE.hearts = Math.max(0, STATE.hearts - 2);
      STATE.grootFouten++;
      STATE.consecutiveGroot++;
    } else if (type === 'klein') {
      STATE.hearts = Math.max(0, STATE.hearts - 1);
      STATE.consecutiveGroot = 0;
    } else if (type === 'mentor') {
      // mentor: no heart lost, retry same scene
      STATE.consecutiveGroot = 0;
    }
    STATE.fouten++;
    updateHUD();

    const content = document.getElementById('scene-content');
    const typeLabel = type === 'groot' ? '🚨 Grote fout — Levensgevaar' : type === 'mentor' ? '👨‍🏫 Leerkracht grijpt in' : '⚠️ Kleine fout';
    const consDiv = document.createElement('div');
    consDiv.className = `consequence ${type}`;
    consDiv.innerHTML = `<div class="consequence-title">${typeLabel}</div><div class="consequence-text">${choice.consequence}</div><button class="btn-continue" onclick="afterConsequence('${type}')">→ Verder</button>`;
    document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
    content.appendChild(consDiv);
    consDiv.scrollIntoView({behavior:'smooth', block:'nearest'});

    // Check game over conditions
    if (STATE.hearts <= 0 || STATE.consecutiveGroot >= 2) {
      setTimeout(() => showGameOver(), 2000);
    }
  }
}

function afterConsequence(type) {
  if (type === 'mentor') {
    // Retry same scene
    renderScene();
  } else {
    advanceScene();
  }
}

function advanceScene() {
  STATE.sceneIndex++;
  if (STATE.sceneIndex >= SCENES.length) {
    showWin();
  } else {
    renderScene();
  }
}

function updateHUD() {
  // Hearts
  let heartsHTML = '';
  for (let i = 0; i < 3; i++) {
    heartsHTML += `<span class="heart ${i < STATE.hearts ? '' : 'lost'}">❤️</span>`;
  }
  document.getElementById('hud-hearts').innerHTML = heartsHTML;
  document.getElementById('hud-xp').textContent = '⚡ ' + STATE.xp + ' XP';
  const sceneNum = Math.min(STATE.sceneIndex + 1, 17);
  document.getElementById('hud-progress').textContent = 'Scene ' + sceneNum + ' / 17';
  const pct = (STATE.sceneIndex / 17) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function showGameOver() {
  document.getElementById('game').style.display = 'none';
  const go = document.getElementById('gameover');
  go.style.display = 'flex';
  document.getElementById('go-stats').innerHTML = `
    <div class="go-stat"><span>Naam</span><span>${STATE.naam}</span></div>
    <div class="go-stat"><span>Klas</span><span>${STATE.klas}</span></div>
    <div class="go-stat"><span>Stap bereikt</span><span>${STATE.sceneIndex + 1} / 17</span></div>
    <div class="go-stat"><span>XP verdiend</span><span>${STATE.xp}</span></div>
    <div class="go-stat"><span>Fouten</span><span>${STATE.fouten}</span></div>
  `;
}

function showWin() {
  document.getElementById('game').style.display = 'none';
  const ws = document.getElementById('winscreen');
  ws.style.display = 'flex';
  const pct = Math.round((1 - STATE.fouten / (STATE.totalScenes * 1.5)) * 100);
  let grade = 'S';
  if (STATE.fouten === 0) grade = 'S+';
  else if (STATE.fouten <= 2) grade = 'S';
  else if (STATE.fouten <= 5) grade = 'A';
  else if (STATE.fouten <= 8) grade = 'B';
  else grade = 'C';
  document.getElementById('win-grade').textContent = grade;
  document.getElementById('win-stats').innerHTML = `
    <div class="win-stat"><span>Naam</span><span>${STATE.naam}</span></div>
    <div class="win-stat"><span>Klas</span><span>${STATE.klas}</span></div>
    <div class="win-stat"><span>Totaal XP</span><span>⚡ ${STATE.xp}</span></div>
    <div class="win-stat"><span>Fouten</span><span>${STATE.fouten}</span></div>
    <div class="win-stat"><span>Grote fouten</span><span>${STATE.grootFouten}</span></div>
    <div class="win-stat"><span>Score</span><span>${grade}</span></div>
  `;
}

function restartGame() {
  document.getElementById('gameover').style.display = 'none';
  document.getElementById('winscreen').style.display = 'none';
  document.getElementById('game').style.display = 'none';
  document.getElementById('splash').style.display = 'flex';
}

// Voice
let speaking = false;
function speakScene() {
  if (speaking) { speechSynthesis.cancel(); speaking = false; return; }
  const scene = SCENES[STATE.sceneIndex];
  const text = scene.text.replace(/<[^>]+>/g,'') + ' ' + (scene.milanQuote ? 'Milan zegt: ' + scene.milanQuote : '') + ' ' + scene.vraag;
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'nl-NL'; utt.rate = 0.95;
  const voices = speechSynthesis.getVoices();
  const nl = voices.find(v => v.lang.startsWith('nl'));
  if (nl) utt.voice = nl;
  utt.onend = () => { speaking = false; };
  speaking = true;
  speechSynthesis.speak(utt);
}
