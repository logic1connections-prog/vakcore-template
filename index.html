<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DrillMaster — Veilig aan de Kolomboormachine</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #06080f;
    color: #e2e8f0;
    min-height: 100vh;
    overflow-x: hidden;
}

/* ===== SPLASH ===== */
#splash {
    position: fixed; inset: 0; z-index: 100;
    background: #06080f;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
}
.splash-logo {
    font-size: 64px; margin-bottom: 12px;
    animation: pulse-glow 2s infinite;
}
.splash-title {
    font-size: 42px; font-weight: 900; letter-spacing: -1px;
    background: linear-gradient(135deg, #00e5ff, #b100ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
}
.splash-sub { color: #64748b; font-size: 14px; margin-bottom: 32px; }
.splash-card {
    background: #0f1628; border: 1px solid #1e2d4a;
    border-radius: 16px; padding: 28px; width: 100%; max-width: 400px;
}
.splash-card h2 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
.form-group { margin-bottom: 16px; }
.form-group label {
    display: block; font-size: 11px; font-weight: 700;
    color: #64748b; text-transform: uppercase; letter-spacing: 0.05em;
    margin-bottom: 6px;
}
.form-group input {
    width: 100%; background: #0a1020; border: 1px solid #1e2d4a;
    border-radius: 8px; color: #e2e8f0; padding: 10px 14px;
    font-size: 14px; outline: none; transition: border-color 0.2s;
}
.form-group input:focus { border-color: #00e5ff; }

/* ===== BUTTONS ===== */
.btn-start {
    width: 100%; background: linear-gradient(135deg, #00e5ff, #0099cc);
    color: #000; font-weight: 900; font-size: 16px;
    border: none; border-radius: 10px; padding: 14px;
    cursor: pointer; transition: all 0.2s; margin-top: 8px;
}
.btn-start:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,229,255,0.3); }

.btn-choice {
    width: 100%; background: #0f1628; border: 2px solid #1e2d4a;
    color: #e2e8f0; font-size: 15px; font-weight: 600;
    border-radius: 12px; padding: 16px 20px; cursor: pointer;
    transition: all 0.25s; text-align: left; display: flex;
    align-items: center; gap: 12px; margin-bottom: 10px;
}
.btn-choice:hover { border-color: #00e5ff; background: #0d1a30; transform: translateX(4px); }
.btn-choice .choice-letter {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 14px;
    background: #1e2d4a; color: #94a3b8;
    transition: all 0.2s;
}
.btn-choice:hover .choice-letter { background: #00e5ff22; color: #00e5ff; }

.btn-continue {
    background: linear-gradient(135deg, #00e5ff, #0099cc);
    color: #000; font-weight: 900; font-size: 15px;
    border: none; border-radius: 10px; padding: 14px 28px;
    cursor: pointer; transition: all 0.2s; margin-top: 16px;
}
.btn-continue:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,229,255,0.3); }

.btn-retry {
    background: linear-gradient(135deg, #ff2eb3, #b100ff);
    color: #fff; font-weight: 900; font-size: 15px;
    border: none; border-radius: 10px; padding: 14px 28px;
    cursor: pointer; transition: all 0.2s; margin-top: 16px;
}
.btn-retry:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,46,179,0.3); }

/* ===== GAME SCREEN ===== */
#game { display: none; min-height: 100vh; }

/* HUD */
.hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    background: rgba(6,8,15,0.95); border-bottom: 1px solid #1e2d4a;
    backdrop-filter: blur(10px);
    padding: 10px 20px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
}
.hud-left { display: flex; align-items: center; gap: 12px; }
.hud-title { font-weight: 900; font-size: 15px; color: #00e5ff; }
.hud-sub { font-size: 11px; color: #64748b; }
.hud-right { display: flex; align-items: center; gap: 16px; }
.hearts { display: flex; gap: 6px; }
.heart { font-size: 22px; transition: all 0.3s; }
.heart.lost { filter: grayscale(1); opacity: 0.3; transform: scale(0.8); }
.xp-display {
    background: #0d1a30; border: 1px solid #00e5ff44;
    border-radius: 20px; padding: 4px 12px;
    font-size: 13px; font-weight: 700; color: #00e5ff;
}
.progress-display {
    background: #0d1a30; border: 1px solid #1e2d4a;
    border-radius: 20px; padding: 4px 12px;
    font-size: 12px; color: #64748b;
}
.hud-player {
    font-size: 12px; color: #94a3b8; font-weight: 600;
}

/* SCENE */
.scene-wrapper {
    padding-top: 70px; min-height: 100vh;
    display: flex; flex-direction: column;
}
.scene-image-container {
    position: relative; width: 100%; height: 0;
    padding-bottom: 42%; overflow: hidden;
    background: #0a0f1e;
}
.scene-image {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transition: opacity 0.6s ease;
}
.scene-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, transparent 40%, #06080f 100%);
}
.scene-badge {
    position: absolute; top: 16px; left: 16px;
    background: rgba(6,8,15,0.85); border: 1px solid #1e2d4a;
    border-radius: 8px; padding: 6px 12px;
    font-size: 12px; font-weight: 700; color: #64748b;
    backdrop-filter: blur(4px);
}
.scene-badge.danger { border-color: #ff444455; color: #ff4444; }
.scene-badge.warning { border-color: #ffaa0055; color: #ffaa00; }
.scene-badge.safe { border-color: #00ff8855; color: #00ff88; }

/* STORY CONTENT */
.story-content {
    flex: 1; padding: 24px 20px 40px;
    max-width: 800px; margin: 0 auto; width: 100%;
}
.scene-number {
    font-size: 11px; font-weight: 700; color: #64748b;
    text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px;
}
.scene-title {
    font-size: 24px; font-weight: 900; color: #fff;
    margin-bottom: 12px; line-height: 1.2;
}
.scene-text {
    font-size: 16px; line-height: 1.7; color: #94a3b8;
    margin-bottom: 28px;
}
.choices-label {
    font-size: 11px; font-weight: 700; color: #64748b;
    text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px;
}

/* CONSEQUENCE PANEL */
.consequence-panel {
    border-radius: 12px; padding: 20px; margin-bottom: 20px;
    border: 2px solid;
}
.consequence-panel.good {
    background: #001a0d; border-color: #00ff8855;
}
.consequence-panel.bad {
    background: #1a0000; border-color: #ff444455;
}
.consequence-panel.fatal {
    background: #1a0008; border-color: #ff2eb355;
    animation: danger-pulse 1s ease-in-out 3;
}
.consequence-icon { font-size: 40px; margin-bottom: 12px; }
.consequence-title {
    font-size: 20px; font-weight: 900; margin-bottom: 8px;
}
.consequence-panel.good .consequence-title { color: #00ff88; }
.consequence-panel.bad .consequence-title { color: #ff4444; }
.consequence-panel.fatal .consequence-title { color: #ff2eb3; }
.consequence-text { font-size: 14px; color: #94a3b8; line-height: 1.6; }

/* GAME OVER */
.gameover-screen {
    text-align: center; padding: 40px 20px;
    max-width: 600px; margin: 0 auto;
}
.gameover-img {
    width: 100%; border-radius: 16px; margin-bottom: 24px;
    border: 2px solid #ff2eb355;
    box-shadow: 0 0 40px rgba(255,46,179,0.2);
}
.gameover-title {
    font-size: 48px; font-weight: 900; color: #ff2eb3;
    margin-bottom: 8px;
    text-shadow: 0 0 30px rgba(255,46,179,0.5);
}
.gameover-sub { font-size: 16px; color: #64748b; margin-bottom: 24px; }

/* WIN SCREEN */
.win-screen {
    text-align: center; padding: 40px 20px;
    max-width: 600px; margin: 0 auto;
}
.win-img {
    width: 100%; border-radius: 16px; margin-bottom: 24px;
    border: 2px solid #ffd70055;
    box-shadow: 0 0 40px rgba(255,215,0,0.2);
}
.win-title {
    font-size: 48px; font-weight: 900;
    background: linear-gradient(135deg, #ffd700, #00e5ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
}
.win-sub { font-size: 16px; color: #64748b; margin-bottom: 24px; }
.win-stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin-bottom: 24px;
}
.win-stat {
    background: #0f1628; border: 1px solid #1e2d4a;
    border-radius: 10px; padding: 16px 8px; text-align: center;
}
.win-stat-val { font-size: 28px; font-weight: 900; color: #00e5ff; }
.win-stat-lbl { font-size: 11px; color: #64748b; margin-top: 4px; }

/* VOICE BUTTON */
.voice-btn {
    background: #0f1628; border: 1px solid #1e2d4a;
    color: #64748b; border-radius: 8px; padding: 6px 12px;
    font-size: 12px; cursor: pointer; transition: all 0.2s;
    display: inline-flex; align-items: center; gap: 6px;
    margin-bottom: 16px;
}
.voice-btn:hover { border-color: #00e5ff55; color: #00e5ff; }
.voice-btn.speaking { border-color: #00e5ff; color: #00e5ff; animation: pulse-glow 1s infinite; }

/* STREAK */
.streak-banner {
    background: linear-gradient(135deg, #ffd70022, #ffaa0022);
    border: 1px solid #ffd70044; border-radius: 10px;
    padding: 10px 16px; margin-bottom: 16px;
    font-size: 13px; font-weight: 700; color: #ffd700;
    display: none; align-items: center; gap: 8px;
}

/* ANIMATIONS */
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse-glow { 0%,100% { box-shadow: 0 0 8px rgba(0,229,255,0.3); } 50% { box-shadow: 0 0 20px rgba(0,229,255,0.7); } }
@keyframes danger-pulse { 0%,100% { box-shadow: 0 0 8px rgba(255,46,179,0.3); } 50% { box-shadow: 0 0 30px rgba(255,46,179,0.8); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
@keyframes heartbeat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.3); } }

.fade-in { animation: fadeIn 0.4s ease; }
.shake { animation: shake 0.5s ease; }

/* SCROLLBAR */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #06080f; }
::-webkit-scrollbar-thumb { background: #1e2d4a; border-radius: 3px; }

/* LEERKRACHT PANEL */
.panel-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.85);
    display: none; align-items: flex-start; justify-content: center;
    padding: 20px; overflow-y: auto;
}
.panel-box {
    background: #0f1628; border: 2px solid #00e5ff44;
    border-radius: 16px; width: 100%; max-width: 700px;
    padding: 28px; margin: auto;
}
.panel-box h2 { font-size: 20px; font-weight: 900; margin-bottom: 20px; }
.panel-section {
    background: #0a1020; border: 1px solid #1e2d4a;
    border-radius: 10px; padding: 16px; margin-bottom: 16px;
}
.panel-section h3 { font-size: 13px; font-weight: 700; color: #64748b; margin-bottom: 12px; text-transform: uppercase; }
.panel-input {
    width: 100%; background: #0f1628; border: 1px solid #1e2d4a;
    border-radius: 8px; color: #e2e8f0; padding: 8px 12px;
    font-size: 13px; outline: none; margin-bottom: 8px;
    transition: border-color 0.2s;
}
.panel-input:focus { border-color: #00e5ff; }
.panel-label { font-size: 11px; color: #64748b; margin-bottom: 4px; display: block; }
.panel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-save-panel {
    background: linear-gradient(135deg, #00e5ff, #0099cc);
    color: #000; font-weight: 700; border: none; border-radius: 8px;
    padding: 10px 20px; cursor: pointer; font-size: 13px;
    transition: all 0.2s; margin-top: 8px;
}
.btn-save-panel:hover { opacity: 0.9; }
.btn-close-panel {
    background: #0f1628; border: 1px solid #ff444433;
    color: #ff4444; border-radius: 8px; padding: 10px 20px;
    cursor: pointer; font-size: 13px; font-weight: 600;
    transition: all 0.2s; float: right;
}
.btn-close-panel:hover { border-color: #ff4444; }
.scene-editor {
    border: 1px solid #1e2d4a; border-radius: 8px;
    padding: 12px; margin-bottom: 10px; background: #060810;
}
.scene-editor-header {
    font-size: 12px; font-weight: 700; color: #00e5ff;
    margin-bottom: 10px; display: flex; justify-content: space-between;
    align-items: center;
}
.choice-editor {
    background: #0f1628; border: 1px solid #1e2d4a;
    border-radius: 6px; padding: 10px; margin-bottom: 6px;
}
.choice-type-select {
    background: #0a1020; border: 1px solid #1e2d4a;
    border-radius: 6px; color: #e2e8f0; padding: 6px 10px;
    font-size: 12px; outline: none; width: 100%; margin-top: 4px;
}

/* MOBILE */
@media (max-width: 600px) {
    .scene-image-container { padding-bottom: 56%; }
    .hud { flex-wrap: wrap; gap: 8px; }
    .win-stats { grid-template-columns: repeat(2, 1fr); }
    .panel-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ===== SPLASH ===== -->
<div id="splash">
    <div class="splash-logo">⚡</div>

    <div class="splash-sub">Veilig aan de Kolomboormachine — Logic Connections · VTI Oostende</div>
    <div class="splash-card fade-in">
        <h2>🎮 Start het avontuur</h2>
        <div class="form-group">
            <label>Jouw naam</label>
            <input type="text" id="input-naam" placeholder="Voornaam Achternaam" />
        </div>

            <label>Jouw klas</label>
            <input type="text" id="input-klas" placeholder="bv. 2B, 3ME..." />
        </div>
        <button class="btn-start" onclick="startGame()">⚡ Start het Avontuur</button>
        <p style="text-align:center;color:#374151;font-size:11px;margin-top:12px;">3 hartjes · 12 scenes · Kies verstandig</p>
    </div>
    <button onclick="showPanel()" style="margin-top:16px;background:none;border:1px solid #1e2d4a;color:#374151;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:12px;">⚙️ Leerkrachtpaneel</button>
</div>

<!-- ===== GAME ===== -->
<div id="game">
    <!-- HUD -->
    <div class="hud">

        </div>
    </div>

    <!-- SCENE AREA -->
    <div class="scene-wrapper" id="scene-wrapper">
        <!-- dynamisch gevuld -->
    </div>
</div>

<!-- ===== LEERKRACHT PANEL ===== -->
<div class="panel-overlay" id="panel-overlay">
    <div class="panel-box">
        <button class="btn-close-panel" onclick="hidePanel()">✕ Sluiten</button>
        <h2>⚙️ Leerkrachtpaneel</h2>
        <div id="panel-content"></div>
    </div>
</div>

// ============================================================
// STATE
// ============================================================
let STATE = {
    naam: "", klas: "",
    hartjes: 3,
    xp: 0,
    sceneIndex: 0,          // index in hoofdpad
    consecutieveFouten: 0,
    totaalFouten: 0,
    totaalJuist: 0,
    gameOver: false,
    gewonnen: false,
    huidigGevolg: null,     // sceneId van gevolg dat getoond wordt
    ttsActief: false
};

let synth = window.speechSynthesis;
let huidigUtterance = null;

// ============================================================
// START
// ============================================================
function startGame() {
    const naam = document.getElementById('input-naam').value.trim();
    const klas = document.getElementById('input-klas').value.trim();
    if (!naam) { alert('Vul je naam in.'); return; }
    STATE.naam = naam;
    STATE.klas = klas || '—';
    STATE.hartjes = GAME.maxHartjes;
    STATE.xp = 0;
    STATE.sceneIndex = 0;
    STATE.consecutieveFouten = 0;
    STATE.totaalFouten = 0;
    STATE.totaalJuist = 0;
    STATE.gameOver = false;
    STATE.gewonnen = false;
    STATE.huidigGevolg = null;

    document.getElementById('splash').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    updateHUD();
    toonScene(GAME.hoofdpad[0]);
}

// ============================================================
// HUD
// ============================================================
function updateHUD() {
    document.getElementById('hud-title').textContent = GAME.titel;
    document.getElementById('hud-sub').textContent = GAME.ondertitel;
    document.getElementById('hud-player').textContent = STATE.naam + ' · ' + STATE.klas;
    document.getElementById('hud-xp').textContent = '⚡ ' + STATE.xp + ' XP';
    document.getElementById('hud-progress').textContent = 'Scene ' + (STATE.sceneIndex + 1) + ' / ' + GAME.hoofdpad.length;

    for (let i = 1; i <= GAME.maxHartjes; i++) {
        const h = document.getElementById('heart-' + i);
        if (h) h.classList.toggle('lost', i > STATE.hartjes);
    }
}

// ============================================================
// SCENE RENDEREN
// ============================================================
function toonScene(sceneId) {
    stopSpeech();
    const scene = GAME.scenes.find(s => s.id === sceneId);
    if (!scene) return;

    const wrapper = document.getElementById('scene-wrapper');
    wrapper.innerHTML = '';
    wrapper.classList.remove('fade-in');
    void wrapper.offsetWidth;
    wrapper.classList.add('fade-in');

    if (scene.type === 'keuze') {
        toonKeuzeScene(scene, wrapper);
    } else if (scene.type === 'gevolg') {
        toonGevolgScene(scene, wrapper, false);
    } else if (scene.type === 'gevolg_groot') {
        toonGevolgScene(scene, wrapper, true);
    }

    updateHUD();
}

function toonKeuzeScene(scene, wrapper) {
    const idx = GAME.hoofdpad.indexOf(scene.id);
    wrapper.innerHTML = `
    <div class="scene-image-container">
        <img class="scene-image" src="${scene.afbeelding}" alt="${scene.titel}" onerror="this.style.background='#0f1628';this.style.display='block'">
        <div class="scene-overlay"></div>
        <div class="scene-badge ${scene.badgeType}">${scene.badge}</div>
    </div>
    <div class="story-content">
        <div class="scene-number">Scene ${idx + 1} van ${GAME.hoofdpad.length}</div>
        <div class="scene-title">${scene.titel}</div>
        <button class="voice-btn" id="voice-btn" onclick="toggleSpeech('${scene.id}')">🔊 Voorlezen</button>
        <div class="scene-text">${scene.tekst}</div>
        <div class="choices-label">Wat doe jij?</div>
        ${scene.keuzes.map((k, i) => `
        <button class="btn-choice" onclick="maakKeuze('${scene.id}', ${i})">
            <span class="choice-letter">${k.letter}</span>
            <span>${k.tekst}</span>
        </button>`).join('')}
    </div>`;
}

function toonGevolgScene(scene, wrapper, isGroot) {
    const type = isGroot ? 'fatal' : 'bad';
    const icon = isGroot ? '🚨' : '⚠️';
    wrapper.innerHTML = `
    <div class="scene-image-container">
        <img class="scene-image" src="${scene.afbeelding}" alt="${scene.titel}" onerror="this.style.background='#0f1628'">
        <div class="scene-overlay"></div>
        <div class="scene-badge ${scene.badgeType}">${scene.badge}</div>
    </div>
    <div class="story-content">
        <div class="consequence-panel ${type}">
            <div class="consequence-icon">${icon}</div>
            <div class="consequence-title">${scene.titel}</div>
            <div class="consequence-text">${scene.tekst}</div>
        </div>
        <button class="voice-btn" id="voice-btn" onclick="toggleSpeechText('${scene.id}')">🔊 Voorlezen</button>
        <div id="gevolg-actie"></div>
    </div>`;

    // Automatisch speech starten
    setTimeout(() => speakText(scene.voiceTekst || scene.tekst), 400);

    // Bepaal wat er na het gevolg gebeurt
    setTimeout(() => {
        const actieDiv = document.getElementById('gevolg-actie');
        if (!actieDiv) return;
        if (STATE.gameOver) {
            actieDiv.innerHTML = `<button class="btn-retry" onclick="toonGameOver()">💀 Bekijk resultaat</button>`;
        } else {
            const volgende = GAME.hoofdpad[STATE.sceneIndex];
            actieDiv.innerHTML = `<button class="btn-continue" onclick="toonScene('${volgende}')">➡️ Verder</button>`;
        }
    }, 300);
}

// ============================================================
// KEUZE VERWERKEN
// ============================================================
function maakKeuze(sceneId, keuzeIdx) {
    stopSpeech();
    const scene = GAME.scenes.find(s => s.id === sceneId);
    const keuze = scene.keuzes[keuzeIdx];

    if (keuze.type === 'goed') {
        // Juiste keuze
        STATE.xp += GAME.xpPerJuist;
        STATE.totaalJuist++;
        STATE.consecutieveFouten = 0;

        // Volgende scene in hoofdpad
        STATE.sceneIndex++;
        if (STATE.sceneIndex >= GAME.hoofdpad.length) {
            toonWin();
        } else {
            toonSuccesFlash(() => toonScene(GAME.hoofdpad[STATE.sceneIndex]));
        }

    } else {
        // Foute keuze
        const isGroot = keuze.type === 'groot_fout';
        STATE.totaalFouten++;
        STATE.consecutieveFouten++;

        if (isGroot) {
            // Grote fout = altijd hartje weg
            verliesHartje();
        } else {
            // Kleine fout = hartje weg
            verliesHartje();
        }

        // XP aftrek
        STATE.xp = Math.max(0, STATE.xp + GAME.xpPerFout);

        // Game over check: 2 fouten na elkaar
        if (STATE.consecutieveFouten >= GAME.consecutieveFoutenGameOver) {
            STATE.gameOver = true;
        }
        // Of geen hartjes meer
        if (STATE.hartjes <= 0) {
            STATE.gameOver = true;
        }

        // Toon gevolg-scene
        const gevolgenMap = GAME.gevolgen[sceneId];
        let gevolgId = null;
        if (gevolgenMap && gevolgenMap[keuzeIdx] !== undefined) {
            gevolgId = gevolgenMap[keuzeIdx];
        }

        if (gevolgId) {
            STATE.huidigGevolg = gevolgId;
            // Na gevolg: als niet game over, ga naar volgende scene in hoofdpad
            if (!STATE.gameOver) {
                STATE.sceneIndex++;
                if (STATE.sceneIndex >= GAME.hoofdpad.length) {
                    STATE.gewonnen = true;
                }
            }
            toonScene(gevolgId);
        } else {
            // Geen gevolg-scene, ga direct verder
            if (STATE.gameOver) {
                toonGameOver();
            } else {
                STATE.sceneIndex++;
                toonScene(GAME.hoofdpad[STATE.sceneIndex] || GAME.hoofdpad[GAME.hoofdpad.length - 1]);
            }
        }
    }
    updateHUD();
}

function verliesHartje() {
    if (STATE.hartjes > 0) STATE.hartjes--;
    // Schud de hartjes
    const heartsEl = document.getElementById('hearts');
    if (heartsEl) {
        heartsEl.classList.add('shake');
        setTimeout(() => heartsEl.classList.remove('shake'), 500);
    }
    updateHUD();
}

function toonSuccesFlash(callback) {
    const wrapper = document.getElementById('scene-wrapper');
    wrapper.innerHTML = `
    <div style="min-height:60vh;display:flex;align-items:center;justify-content:center;padding:40px;">
        <div class="fade-in" style="text-align:center;">
            <div style="font-size:64px;margin-bottom:16px;">✅</div>
            <div style="font-size:24px;font-weight:900;color:#00ff88;margin-bottom:8px;">Juiste keuze!</div>
            <div style="font-size:14px;color:#64748b;margin-bottom:24px;">+${GAME.xpPerJuist} XP verdiend</div>
            <button class="btn-continue" onclick="(${callback})()">➡️ Verder</button>
        </div>
    </div>`;
}

// ============================================================
// GAME OVER
// ============================================================
function toonGameOver() {
    stopSpeech();
    const wrapper = document.getElementById('scene-wrapper');
    wrapper.innerHTML = `
    <div style="padding-top:20px;">
        <div class="gameover-screen fade-in">
            <img class="gameover-img" src="images/scene_gameover.png" alt="Game Over" onerror="this.style.display='none'">
            <div class="gameover-title">GAME OVER</div>
            <div class="gameover-sub">Je veiligheidsfouten hadden ernstige gevolgen.<br>Leer ervan en probeer opnieuw.</div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;">
                <div class="win-stat"><div class="win-stat-val" style="color:#ff4444;">${STATE.totaalFouten}</div><div class="win-stat-lbl">Fouten</div></div>
                <div class="win-stat"><div class="win-stat-val">${STATE.totaalJuist}</div><div class="win-stat-lbl">Juist</div></div>
                <div class="win-stat"><div class="win-stat-val">${STATE.xp}</div><div class="win-stat-lbl">XP</div></div>
            </div>
            <button class="btn-retry" onclick="herstart()">🔄 Opnieuw proberen</button>
        </div>
    </div>`;
    speakText('Game over. Je veiligheidsfouten hadden ernstige gevolgen. Leer ervan en probeer opnieuw.');
}

// ============================================================
// WIN
// ============================================================
function toonWin() {
    stopSpeech();
    const wrapper = document.getElementById('scene-wrapper');
    const score = Math.round((STATE.totaalJuist / GAME.hoofdpad.length) * 100);
    wrapper.innerHTML = `
    <div style="padding-top:20px;">
        <div class="win-screen fade-in">
            <img class="win-img" src="images/scene_success.png" alt="Gewonnen!" onerror="this.style.display='none'">
            <div class="win-title">MEESTER!</div>
            <div class="win-sub">Je hebt alle 12 scenes doorstaan.<br>Je bent klaar voor de echte werkplaats.</div>
            <div class="win-stats">
                <div class="win-stat"><div class="win-stat-val">${STATE.xp}</div><div class="win-stat-lbl">Totaal XP</div></div>
                <div class="win-stat"><div class="win-stat-val">${score}%</div><div class="win-stat-lbl">Score</div></div>
                <div class="win-stat"><div class="win-stat-val">${STATE.hartjes}❤️</div><div class="win-stat-lbl">Hartjes over</div></div>
            </div>
            <button class="btn-continue" onclick="herstart()">🔄 Opnieuw spelen</button>
        </div>
    </div>`;
    speakText('Gefeliciteerd! Je hebt alle twaalf scenes doorstaan. Je bent klaar voor de echte werkplaats!');
}

// ============================================================
// HERSTART
// ============================================================
function herstart() {
    stopSpeech();
    STATE.hartjes = GAME.maxHartjes;
    STATE.xp = 0;
    STATE.sceneIndex = 0;
    STATE.consecutieveFouten = 0;
    STATE.totaalFouten = 0;
    STATE.totaalJuist = 0;
    STATE.gameOver = false;
    STATE.gewonnen = false;
    STATE.huidigGevolg = null;
    updateHUD();
    toonScene(GAME.hoofdpad[0]);
}

// ============================================================
// SPEECH (Text-to-Speech)
// ============================================================
function speakText(tekst) {
    if (!synth) return;
    stopSpeech();
    const u = new SpeechSynthesisUtterance(tekst);
    u.lang = 'nl-NL';
    u.rate = 0.95;
    u.pitch = 1;
    huidigUtterance = u;
    u.onstart = () => {
        const btn = document.getElementById('voice-btn');
        if (btn) btn.classList.add('speaking');
        STATE.ttsActief = true;
    };
    u.onend = () => {
        const btn = document.getElementById('voice-btn');
        if (btn) btn.classList.remove('speaking');
        STATE.ttsActief = false;
    };
    synth.speak(u);
}

function stopSpeech() {
    if (synth) synth.cancel();
    STATE.ttsActief = false;
    const btn = document.getElementById('voice-btn');
    if (btn) btn.classList.remove('speaking');
}

function toggleSpeech(sceneId) {
    if (STATE.ttsActief) {
        stopSpeech();
    } else {
        const scene = GAME.scenes.find(s => s.id === sceneId);
        if (scene) speakText(scene.voiceTekst || scene.tekst);
    }
}

function toggleSpeechText(sceneId) {
    if (STATE.ttsActief) {
        stopSpeech();
    } else {
        const scene = GAME.scenes.find(s => s.id === sceneId);
        if (scene) speakText(scene.voiceTekst || scene.tekst);
    }
}

// ============================================================
// LEERKRACHT PANEL
// ============================================================
function showPanel() {
    renderPanel();
    document.getElementById('panel-overlay').style.display = 'flex';
}

function hidePanel() {
    document.getElementById('panel-overlay').style.display = 'none';
}

function renderPanel() {
    const c = document.getElementById('panel-content');
    c.innerHTML = `
    <div class="panel-section">
        <h3>Algemene instellingen</h3>
        <div class="panel-grid">
            <div>
                <label class="panel-label">Titel</label>
                <input class="panel-input" id="p-titel" value="${GAME.titel}" />
            </div>
            <div>
                <label class="panel-label">Ondertitel</label>
                <input class="panel-input" id="p-sub" value="${GAME.ondertitel}" />
            </div>
            <div>
                <label class="panel-label">XP per juiste keuze</label>
                <input class="panel-input" type="number" id="p-xp" value="${GAME.xpPerJuist}" />
            </div>
            <div>
                <label class="panel-label">Max hartjes</label>
                <input class="panel-input" type="number" id="p-hartjes" value="${GAME.maxHartjes}" min="1" max="5" />
            </div>
        </div>
        <button class="btn-save-panel" onclick="slaAlgemeenOp()">💾 Opslaan</button>
    </div>

    <div class="panel-section">
        <h3>📖 Scenes bewerken</h3>
        <p style="font-size:12px;color:#64748b;margin-bottom:12px;">Klik op een scene om de tekst en keuzes aan te passen.</p>
        ${GAME.scenes.filter(s => s.type === 'keuze').map(s => `
        <div class="scene-editor">
            <div class="scene-editor-header">
                <span>${s.badge}</span>
                <button onclick="toggleSceneEditor('${s.id}')" style="background:#0d1a30;border:1px solid #00e5ff44;color:#00e5ff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:11px;">✏️ Bewerken</button>
            </div>
            <div id="editor-${s.id}" style="display:none;">
                <label class="panel-label">Titel</label>
                <input class="panel-input" id="se-titel-${s.id}" value="${s.titel}" />
                <label class="panel-label">Verhaal tekst</label>
                <textarea class="panel-input" id="se-tekst-${s.id}" rows="3" style="resize:vertical;">${s.tekst}</textarea>
                <label class="panel-label">Afbeelding pad (bv. images/mijn_foto.jpg)</label>
                <input class="panel-input" id="se-img-${s.id}" value="${s.afbeelding}" />
                ${s.keuzes.map((k, ki) => `
                <div class="choice-editor">
                    <label class="panel-label">Keuze ${k.letter}</label>
                    <input class="panel-input" id="se-keuze-${s.id}-${ki}" value="${k.tekst}" />
                    <label class="panel-label">Type</label>
                    <select class="choice-type-select" id="se-type-${s.id}-${ki}">
                        <option value="goed" ${k.type==='goed'?'selected':''}>✅ Goed (juiste keuze)</option>
                        <option value="klein_fout" ${k.type==='klein_fout'?'selected':''}>⚠️ Kleine fout (hartje weg)</option>
                        <option value="groot_fout" ${k.type==='groot_fout'?'selected':''}>🚨 Grote fout (levensgevaarlijk)</option>
                    </select>
                </div>`).join('')}
                <button class="btn-save-panel" onclick="slaSceneOp('${s.id}')">💾 Scene opslaan</button>
            </div>
        </div>`).join('')}
    </div>`;
}

function toggleSceneEditor(id) {
    const el = document.getElementById('editor-' + id);
    if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function slaAlgemeenOp() {
    GAME.titel = document.getElementById('p-titel').value.trim() || GAME.titel;
    GAME.ondertitel = document.getElementById('p-sub').value.trim() || GAME.ondertitel;
    GAME.xpPerJuist = parseInt(document.getElementById('p-xp').value) || GAME.xpPerJuist;
    GAME.maxHartjes = parseInt(document.getElementById('p-hartjes').value) || GAME.maxHartjes;
    updateHUD();
    alert('✅ Opgeslagen!');
}

function slaSceneOp(sceneId) {
    const scene = GAME.scenes.find(s => s.id === sceneId);
    if (!scene) return;
    scene.titel = document.getElementById(`se-titel-${sceneId}`)?.value.trim() || scene.titel;
    scene.tekst = document.getElementById(`se-tekst-${sceneId}`)?.value.trim() || scene.tekst;
    scene.voiceTekst = scene.tekst;
    scene.afbeelding = document.getElementById(`se-img-${sceneId}`)?.value.trim() || scene.afbeelding;
    scene.keuzes.forEach((k, ki) => {
        k.tekst = document.getElementById(`se-keuze-${sceneId}-${ki}`)?.value.trim() || k.tekst;
        k.type = document.getElementById(`se-type-${sceneId}-${ki}`)?.value || k.type;
    });
    alert(`✅ Scene opgeslagen!`);
}

// ============================================================
// BOOT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
    // Zet hartjes correct
    const heartsDiv = document.getElementById('hearts');
    if (heartsDiv) {
        heartsDiv.innerHTML = '';
        for (let i = 1; i <= 3; i++) {
            heartsDiv.innerHTML += `<span class="heart" id="heart-${i}">❤️</span>`;
        }
    }
});
</script>
</body>
</html>
