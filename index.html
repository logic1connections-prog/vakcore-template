<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VakCore — Leerpad</title>
<style>
:root {
  --bg: #0a0e1a;
  --bg2: #111827;
  --bg3: #1a2235;
  --cyan: #00e5ff;
  --purple: #a855f7;
  --pink: #ec4899;
  --gold: #f59e0b;
  --green: #10b981;
  --red: #ef4444;
  --orange: #f97316;
  --text: #e2e8f0;
  --muted: #64748b;
  --border: #1e293b;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* SPLASH */
#splash {
  position: fixed; inset: 0; z-index: 100;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
}
.splash-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2.5rem 2rem;
  width: 100%; max-width: 400px;
  text-align: center;
  box-shadow: 0 0 60px rgba(168,85,247,0.15);
}
.splash-logo {
  width: 72px; height: 72px;
  background: linear-gradient(135deg, var(--purple), var(--cyan));
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; margin: 0 auto 1.25rem;
  box-shadow: 0 0 30px rgba(168,85,247,0.4);
}
.splash-title { font-size: 2rem; font-weight: 900; color: var(--cyan); letter-spacing: -0.02em; }
.splash-sub { font-size: 0.8rem; color: var(--purple); font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.25rem; }
.splash-org { font-size: 0.75rem; color: var(--muted); margin-bottom: 2rem; }
.splash-input {
  width: 100%; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 0.95rem;
  padding: 0.75rem 1rem; margin-bottom: 0.75rem; outline: none;
  transition: border-color 0.2s;
}
.splash-input:focus { border-color: var(--cyan); }
.splash-btn {
  width: 100%; background: linear-gradient(135deg, var(--purple), var(--cyan));
  border: none; border-radius: 8px; color: #fff; font-size: 1rem;
  font-weight: 700; padding: 0.85rem; cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  letter-spacing: 0.02em;
}
.splash-btn:hover { opacity: 0.9; transform: translateY(-1px); }

/* APP */
#app { display: none; min-height: 100vh; }

/* HEADER */
.app-header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0.75rem 1.5rem;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}
.header-brand { display: flex; align-items: center; gap: 0.75rem; }
.header-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--purple), var(--cyan));
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
}
.header-name { font-size: 1rem; font-weight: 800; color: var(--cyan); }
.header-sub-title { font-size: 0.7rem; color: var(--muted); }
.header-user { display: flex; align-items: center; gap: 0.75rem; }
.user-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 0.85rem;
}
.user-info { text-align: right; }
.user-name { font-size: 0.85rem; font-weight: 700; }
.user-klas { font-size: 0.7rem; color: var(--muted); }
.header-ronde {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 20px; padding: 0.25rem 0.75rem;
  font-size: 0.7rem; font-weight: 700; color: var(--gold);
  text-transform: uppercase; letter-spacing: 0.05em;
}
.logout-btn {
  background: none; border: none; color: var(--muted);
  cursor: pointer; font-size: 1.1rem; padding: 0.25rem;
  transition: color 0.2s;
}
.logout-btn:hover { color: var(--red); }

/* STATS BAR */
.stats-bar {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1rem; padding: 1rem 1.5rem;
  background: var(--bg2); border-bottom: 1px solid var(--border);
}
.stat-card {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 12px; padding: 1rem 1.25rem;
}
.stat-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.4rem; display: flex; align-items: center; gap: 0.4rem; }
.stat-value { font-size: 1.6rem; font-weight: 900; }
.stat-value.cyan { color: var(--cyan); }
.stat-value.purple { color: var(--purple); }
.stat-value.green { color: var(--green); }
.stat-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 0.5rem; overflow: hidden; }
.stat-bar-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--purple), var(--cyan)); transition: width 0.5s ease; }

/* MAIN CONTENT */
.main-content { padding: 1.5rem; max-width: 1100px; margin: 0 auto; }

/* TABS */
.tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
.tab-btn {
  background: none; border: none; color: var(--muted);
  font-size: 0.85rem; font-weight: 600; padding: 0.6rem 1rem;
  cursor: pointer; border-bottom: 2px solid transparent;
  margin-bottom: -1px; transition: all 0.2s;
}
.tab-btn.active { color: var(--cyan); border-bottom-color: var(--cyan); }
.tab-btn:hover:not(.active) { color: var(--text); }

/* SIDEBAR + CONTENT GRID */
.content-grid { display: grid; grid-template-columns: 220px 1fr; gap: 1.5rem; }
@media(max-width: 768px) { .content-grid { grid-template-columns: 1fr; } }

/* PROGRESS SIDEBAR */
.progress-sidebar { }
.sidebar-section { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
.sidebar-section-title { font-size: 0.75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1rem; }
.xp-bar-wrap { margin-bottom: 0.5rem; }
.xp-bar-label { display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 0.4rem; }
.xp-bar-label span:first-child { color: var(--text); font-weight: 600; }
.xp-bar-label span:last-child { color: var(--cyan); font-weight: 700; }
.xp-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.xp-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--purple), var(--cyan)); transition: width 0.5s; }
.pct-label { font-size: 0.7rem; color: var(--muted); text-align: right; margin-top: 0.2rem; }

/* LEVEL DOTS */
.level-dots { display: flex; flex-direction: column; align-items: center; gap: 0; }
.level-dot-wrap { display: flex; flex-direction: column; align-items: center; }
.level-dot {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.75rem; font-weight: 900; cursor: pointer;
  border: 2px solid var(--border); background: var(--bg3);
  color: var(--muted); transition: all 0.2s; position: relative;
}
.level-dot.done { background: var(--green); border-color: var(--green); color: #fff; }
.level-dot.active { background: var(--purple); border-color: var(--purple); color: #fff; box-shadow: 0 0 12px rgba(168,85,247,0.5); }
.level-dot.boss { background: linear-gradient(135deg, var(--red), var(--orange)); border-color: var(--red); color: #fff; }
.level-dot.boss.active { box-shadow: 0 0 16px rgba(239,68,68,0.6); }
.level-connector { width: 2px; height: 16px; background: var(--border); }
.level-connector.done { background: var(--green); }
.level-dot-label { font-size: 0.6rem; color: var(--muted); margin: 2px 0 4px; }

/* LEVELS LIST */
.levels-list { display: flex; flex-direction: column; gap: 1rem; }

/* LEVEL CARD */
.level-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 14px; overflow: hidden; transition: border-color 0.2s;
}
.level-card.active-level { border-color: var(--purple); box-shadow: 0 0 20px rgba(168,85,247,0.1); }
.level-card.locked-level { opacity: 0.5; }
.level-card.boss-level { border-color: var(--red); }
.level-card.boss-level.active-level { box-shadow: 0 0 20px rgba(239,68,68,0.2); }

.level-header {
  padding: 1rem 1.25rem;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; user-select: none;
}
.level-header:hover { background: rgba(255,255,255,0.02); }
.level-header-left { display: flex; align-items: center; gap: 0.75rem; }
.level-icon {
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; font-weight: 900; flex-shrink: 0;
}
.level-icon.normal { background: rgba(168,85,247,0.15); color: var(--purple); border: 1px solid rgba(168,85,247,0.3); }
.level-icon.done { background: rgba(16,185,129,0.15); color: var(--green); border: 1px solid rgba(16,185,129,0.3); }
.level-icon.boss { background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
.level-title { font-size: 0.95rem; font-weight: 700; }
.level-desc { font-size: 0.75rem; color: var(--muted); margin-top: 0.15rem; }
.level-header-right { display: flex; align-items: center; gap: 0.75rem; }
.level-badge {
  font-size: 0.65rem; font-weight: 700; padding: 0.2rem 0.6rem;
  border-radius: 20px; text-transform: uppercase; letter-spacing: 0.05em;
}
.level-badge.easy { background: rgba(16,185,129,0.15); color: var(--green); border: 1px solid rgba(16,185,129,0.3); }
.level-badge.medium { background: rgba(245,158,11,0.15); color: var(--gold); border: 1px solid rgba(245,158,11,0.3); }
.level-badge.hard { background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
.level-xp { font-size: 0.75rem; font-weight: 700; color: var(--cyan); }
.level-chevron { color: var(--muted); font-size: 0.8rem; transition: transform 0.2s; }
.level-chevron.open { transform: rotate(90deg); }

.level-body { display: none; border-top: 1px solid var(--border); }
.level-body.open { display: block; }

/* LESSONS */
.lessons-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.lesson-item {
  padding: 1rem 1.25rem;
  border-right: 1px solid var(--border);
  cursor: pointer; transition: background 0.15s;
  position: relative;
}
.lesson-item:nth-child(2) { border-right: none; }
.lesson-item:hover { background: rgba(255,255,255,0.03); }
.lesson-item.done-lesson { background: rgba(16,185,129,0.05); }
.lesson-label {
  font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; margin-bottom: 0.4rem;
}
.lesson-label.a { color: var(--cyan); }
.lesson-label.b { color: var(--pink); }
.lesson-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 0.3rem; }
.lesson-desc { font-size: 0.75rem; color: var(--muted); line-height: 1.4; margin-bottom: 0.6rem; }
.lesson-meta { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.lesson-tag {
  font-size: 0.65rem; padding: 0.15rem 0.5rem; border-radius: 20px;
  font-weight: 600;
}
.lesson-tag.beginner { background: rgba(16,185,129,0.15); color: var(--green); }
.lesson-tag.medium { background: rgba(245,158,11,0.15); color: var(--gold); }
.lesson-tag.hard { background: rgba(239,68,68,0.15); color: var(--red); }
.lesson-xp { font-size: 0.7rem; color: var(--cyan); font-weight: 700; }
.lesson-time { font-size: 0.7rem; color: var(--muted); }
.lesson-check {
  position: absolute; top: 1rem; right: 1rem;
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid var(--border); background: var(--bg3);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem;
}
.lesson-check.done { background: var(--green); border-color: var(--green); color: #fff; }
.lesson-play-btn {
  position: absolute; top: 1rem; right: 1rem;
  color: var(--cyan); font-size: 1rem;
}

/* GATEKEEPER */
.gatekeeper-bar {
  padding: 0.75rem 1.25rem;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(0,0,0,0.2);
}
.gatekeeper-info { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; }
.gatekeeper-info.locked { color: var(--muted); }
.gatekeeper-info.ready { color: var(--gold); }
.gatekeeper-info.passed { color: var(--green); }
.gatekeeper-btn {
  background: var(--gold); border: none; border-radius: 8px;
  color: #000; font-weight: 700; font-size: 0.8rem;
  padding: 0.4rem 1rem; cursor: pointer; transition: opacity 0.2s;
}
.gatekeeper-btn:hover { opacity: 0.85; }
.gatekeeper-score { font-size: 0.75rem; font-weight: 700; color: var(--green); }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  padding: 1rem;
}
.modal-overlay.hidden { display: none; }
.modal {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 16px; width: 100%; max-width: 560px;
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 0 60px rgba(0,0,0,0.5);
}
.modal-header {
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-title { font-size: 1.1rem; font-weight: 800; }
.modal-close {
  background: none; border: none; color: var(--muted);
  font-size: 1.3rem; cursor: pointer; padding: 0.2rem;
  transition: color 0.2s; line-height: 1;
}
.modal-close:hover { color: var(--text); }
.modal-body { padding: 1.5rem; }

/* LESSON MODAL */
.lesson-modal-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.3rem; }
.lesson-modal-title { font-size: 1.4rem; font-weight: 900; margin-bottom: 0.5rem; }
.lesson-modal-desc { color: var(--muted); font-size: 0.9rem; line-height: 1.6; margin-bottom: 1.25rem; }
.activity-box {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 10px; padding: 1rem; margin-bottom: 1.25rem;
}
.activity-box-title { font-size: 0.75rem; font-weight: 700; color: var(--purple); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.5rem; }
.activity-name { font-size: 1rem; font-weight: 700; }
.activity-sub { font-size: 0.8rem; color: var(--muted); margin-top: 0.2rem; }

/* QUIZ */
.quiz-section { margin-top: 1.25rem; }
.quiz-title { font-size: 0.85rem; font-weight: 700; color: var(--gold); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
.quiz-question { margin-bottom: 1.25rem; }
.quiz-q-text { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.75rem; line-height: 1.4; }
.quiz-options { display: flex; flex-direction: column; gap: 0.4rem; }
.quiz-option {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; padding: 0.65rem 1rem;
  font-size: 0.85rem; cursor: pointer; transition: all 0.15s;
  text-align: left; color: var(--text); font-family: inherit;
}
.quiz-option:hover:not(:disabled) { border-color: var(--cyan); background: rgba(0,229,255,0.05); }
.quiz-option.correct { border-color: var(--green); background: rgba(16,185,129,0.1); color: var(--green); }
.quiz-option.wrong { border-color: var(--red); background: rgba(239,68,68,0.1); color: var(--red); }
.quiz-option:disabled { cursor: default; }

.modal-footer {
  padding: 1rem 1.5rem;
  border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 0.75rem;
}
.btn-primary {
  background: linear-gradient(135deg, var(--purple), var(--cyan));
  border: none; border-radius: 8px; color: #fff;
  font-weight: 700; font-size: 0.9rem; padding: 0.65rem 1.5rem;
  cursor: pointer; transition: opacity 0.2s;
}
.btn-primary:hover { opacity: 0.85; }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-secondary {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text);
  font-weight: 600; font-size: 0.9rem; padding: 0.65rem 1.25rem;
  cursor: pointer; transition: background 0.2s;
}
.btn-secondary:hover { background: #2d3748; }

/* GATEKEEPER MODAL */
.gate-score-big { font-size: 3rem; font-weight: 900; text-align: center; margin: 1rem 0; }
.gate-score-big.pass { color: var(--green); }
.gate-score-big.fail { color: var(--red); }
.gate-result-text { text-align: center; font-size: 0.9rem; color: var(--muted); margin-bottom: 1.5rem; }

/* BADGES */
.badges-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
.badge-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 1.25rem; text-align: center;
  transition: border-color 0.2s;
}
.badge-card.earned { border-color: var(--gold); box-shadow: 0 0 15px rgba(245,158,11,0.15); }
.badge-card.locked-badge { opacity: 0.4; }
.badge-emoji { font-size: 2rem; margin-bottom: 0.5rem; }
.badge-name { font-size: 0.8rem; font-weight: 700; margin-bottom: 0.25rem; }
.badge-desc { font-size: 0.7rem; color: var(--muted); line-height: 1.3; }

/* LEADERBOARD */
.leaderboard-list { display: flex; flex-direction: column; gap: 0.5rem; }
.lb-item {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; padding: 0.75rem 1rem;
  display: flex; align-items: center; gap: 0.75rem;
}
.lb-item.me { border-color: var(--purple); background: rgba(168,85,247,0.05); }
.lb-rank { font-size: 1rem; font-weight: 900; width: 28px; text-align: center; }
.lb-rank.gold { color: var(--gold); }
.lb-rank.silver { color: #94a3b8; }
.lb-rank.bronze { color: #b45309; }
.lb-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 0.8rem; flex-shrink: 0;
}
.lb-name { flex: 1; font-weight: 600; font-size: 0.9rem; }
.lb-xp { font-weight: 700; color: var(--cyan); font-size: 0.85rem; }

/* RONDE BANNER */
.ronde-banner {
  background: linear-gradient(135deg, rgba(168,85,247,0.1), rgba(0,229,255,0.05));
  border: 1px solid rgba(168,85,247,0.3);
  border-radius: 10px; padding: 0.75rem 1.25rem;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1.25rem;
}
.ronde-info { font-size: 0.85rem; }
.ronde-info strong { color: var(--purple); }
.ronde-mult { font-size: 0.75rem; color: var(--cyan); font-weight: 700; }

/* TOAST */
.toast {
  position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 300;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; padding: 0.75rem 1.25rem;
  font-size: 0.85rem; font-weight: 600;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  transform: translateY(100px); opacity: 0;
  transition: all 0.3s; pointer-events: none;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { border-color: var(--green); color: var(--green); }
.toast.info { border-color: var(--cyan); color: var(--cyan); }
.toast.warning { border-color: var(--gold); color: var(--gold); }

/* EMPTY STATE */
.empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }
.empty-state-icon { font-size: 3rem; margin-bottom: 1rem; }
.empty-state-text { font-size: 0.9rem; }

@media(max-width: 600px) {
  .stats-bar { grid-template-columns: 1fr; }
  .lessons-grid { grid-template-columns: 1fr; }
  .lesson-item:nth-child(2) { border-right: none; border-top: 1px solid var(--border); }
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-card">
    <div class="splash-logo">⚡</div>
    <div class="splash-sub">Logic Connections · VTI Oostende</div>
    <div class="splash-title" id="splash-title">VakCore</div>
    <div class="splash-org" id="splash-org">Leerpad Template</div>
    <input class="splash-input" id="input-naam" type="text" placeholder="Jouw naam" autocomplete="off">
    <input class="splash-input" id="input-klas" type="text" placeholder="Jouw klas (bv. 2B)" autocomplete="off">
    <button class="splash-btn" onclick="startLeerpad()">⚡ Start het Leerpad</button>
  </div>
</div>

<!-- APP -->

<!-- GATEKEEPER MODAL -->
<div class="modal-overlay hidden" id="gate-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">🔐 Gatekeeper</div>
      <button class="modal-close" onclick="closeModal('gate-modal')">✕</button>
    </div>
    <div class="modal-body" id="gate-modal-body"></div>
    <div class="modal-footer" id="gate-modal-footer"></div>
  </div>
</div>

<script>
// ============================================================
// CONFIG — pas dit aan voor elk nieuw leerpad
// ============================================================
let CONFIG = {
  titel: "VakCore",
  ondertitel: "Leerpad Template",
  gatekeeperMinScore: 70,
  xpPerLes: 75,
  levels: Array.from({length: 7}, (_, i) => ({
    id: i + 1,
    naam: `Level ${i + 1}`,
    omschrijving: `Omschrijving van level ${i + 1}`,
    lessen: [
      {
        id: `${i+1}-A`,
        label: 'A',
        naam: `Les ${i+1}.1`,
        omschrijving: 'Klik op de les om de inhoud te bekijken.',
        activiteit: null,
        activiteitSub: null,
        tijdsduur: '15 min',
        quizVragen: []
      },
      {
        id: `${i+1}-B`,
        label: 'B',
        naam: `Les ${i+1}.2`,
        omschrijving: 'Klik op de les om de inhoud te bekijken.',
        activiteit: null,
        activiteitSub: null,
        tijdsduur: '20 min',
        quizVragen: []
      }
    ]
  })),
  bigBoss: {
    id: 8,
    naam: '⚔️ Big Boss',
    omschrijving: 'De ultieme uitdaging. Bewijs dat je alles beheerst.',
    lessen: [
      { id: '8-A', label: 'A', naam: 'Boss Les 1', omschrijving: 'Finale opdracht deel 1.', activiteit: null, activiteitSub: null, tijdsduur: '30 min', quizVragen: [] },
      { id: '8-B', label: 'B', naam: 'Boss Les 2', omschrijving: 'Finale opdracht deel 2.', activiteit: null, activiteitSub: null, tijdsduur: '30 min', quizVragen: [] }
    ]
  },
  badges: [
    { id: 'eerste_les', emoji: '🎯', naam: 'Eerste Stap', beschrijving: 'Eerste les voltooid', trigger: 'les_count', waarde: 1 },
    { id: 'level1', emoji: '⚡', naam: 'Level Up!', beschrijving: 'Level 1 gepasseerd', trigger: 'level_done', waarde: 1 },
    { id: 'halfway', emoji: '🔥', naam: 'Halverwege', beschrijving: '4 levels voltooid', trigger: 'level_done', waarde: 4 },
    { id: 'alle_levels', emoji: '🏆', naam: 'Meester', beschrijving: 'Alle 7 levels voltooid', trigger: 'level_done', waarde: 7 },
    { id: 'big_boss', emoji: '👑', naam: 'Boss Slayer', beschrijving: 'Big Boss verslagen', trigger: 'boss_done' },
    { id: 'ronde2', emoji: '🌟', naam: 'Medium Mode', beschrijving: 'Ronde 2 gestart', trigger: 'ronde', waarde: 2 },
    { id: 'ronde3', emoji: '💎', naam: 'Hard Core', beschrijving: 'Ronde 3 gestart', trigger: 'ronde', waarde: 3 },
    { id: 'perfectionist', emoji: '✨', naam: 'Perfectionist', beschrijving: 'Alle lessen voltooid', trigger: 'all_done' }
  ]
};

// ============================================================
// STATE
// ============================================================
const RONDE_NAMES = ['EASY', 'MEDIUM', 'HARD'];
const RONDE_MULT = [1, 1.5, 2];
const RONDE_TAGS = ['easy', 'medium', 'hard'];

let STATE = {
  naam: '',
  klas: '',
  ronde: 0,
  voltooideIds: [],
  gatekeeperPassed: [],
  badges: [],
  openLevels: []
};

let currentLesData = null;
let currentQuizAnswers = {};

// ============================================================
// PERSISTENCE
// ============================================================
function saveConfig() {
  localStorage.setItem('vakcore_config', JSON.stringify(CONFIG));
}
function loadConfig() {
  const c = localStorage.getItem('vakcore_config');
  if (c) {
    try { CONFIG = { ...CONFIG, ...JSON.parse(c) }; } catch(e) {}
  }
}
function saveState() {
  localStorage.setItem('vakcore_state', JSON.stringify(STATE));
}
function loadState() {
  const s = localStorage.getItem('vakcore_state');
  if (s) {
    try { STATE = { ...STATE, ...JSON.parse(s) }; } catch(e) {}
  }
}

// ============================================================
// HELPERS
// ============================================================
function getAllLevels() {
  return [...CONFIG.levels, CONFIG.bigBoss];
}
function getAllLessen() {
  return getAllLevels().flatMap(l => l.lessen);
}
function isLevelUnlocked(levelId) {
  if (levelId === 1) return true;
  if (levelId === 8) return STATE.gatekeeperPassed.includes(7);
  return STATE.gatekeeperPassed.includes(levelId - 1);
}
function isLevelDone(levelId) {
  return STATE.gatekeeperPassed.includes(levelId);
}
function getLesVoltooid(lesId) {
  return STATE.voltooideIds.includes(lesId);
}
function getXpMultiplier() { return RONDE_MULT[STATE.ronde]; }
function getTotalXP() {
  return Math.round(STATE.voltooideIds.length * CONFIG.xpPerLes * getXpMultiplier());
}
function getMaxXP() {
  return Math.round(getAllLessen().length * CONFIG.xpPerLes * getXpMultiplier() * 3);
}
function getVoltooideCount() { return STATE.voltooideIds.length; }
function getTotalLessen() { return getAllLessen().length; }

// ============================================================
// TOAST
// ============================================================
function showToast(msg, type = 'info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ============================================================
// AUTH
// ============================================================
function startLeerpad() {
  const naam = document.getElementById('input-naam').value.trim();
  const klas = document.getElementById('input-klas').value.trim();
  if (!naam) { showToast('Vul je naam in', 'warning'); return; }
  STATE.naam = naam;
  STATE.klas = klas;
  saveState();
  enterApp();
}
function logout() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('splash').style.display = 'flex';
}
function enterApp() {
  document.getElementById('splash').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('splash-title').textContent = CONFIG.titel;
  document.getElementById('splash-org').textContent = CONFIG.ondertitel;
  renderApp();
}

// ============================================================
// RENDER APP
// ============================================================
function renderApp() {
  // Header
  document.getElementById('header-title').textContent = CONFIG.titel;
  document.getElementById('header-subtitle').textContent = CONFIG.ondertitel;
  document.getElementById('header-naam').textContent = STATE.naam;
  document.getElementById('header-klas').textContent = 'Klas ' + (STATE.klas || '—');
  document.getElementById('header-avatar').textContent = STATE.naam[0]?.toUpperCase() || '?';
  const rondeTag = RONDE_TAGS[STATE.ronde];
  document.getElementById('header-ronde').textContent = RONDE_NAMES[STATE.ronde];
  document.getElementById('header-ronde').className = `header-ronde ${rondeTag}`;

  // Stats
  const done = getVoltooideCount();
  const total = getTotalLessen();
  const xp = getTotalXP();
  const maxXp = getMaxXP();
  const pct = total > 0 ? Math.round(done / total * 100) : 0;
  document.getElementById('stat-pct').textContent = pct + '%';
  document.getElementById('stat-bar').style.width = pct + '%';
  document.getElementById('stat-xp').textContent = xp + ' / ' + maxXp;
  document.getElementById('stat-xp-bar').style.width = (maxXp > 0 ? Math.round(xp/maxXp*100) : 0) + '%';
  document.getElementById('stat-done').textContent = done + ' / ' + total;
  document.getElementById('sidebar-xp').textContent = xp + ' / ' + maxXp + ' XP';
  document.getElementById('sidebar-xp-bar').style.width = (maxXp > 0 ? Math.round(xp/maxXp*100) : 0) + '%';
  document.getElementById('sidebar-pct').textContent = pct + '% voltooid';

  // Ronde banner
  document.getElementById('ronde-naam').textContent = RONDE_NAMES[STATE.ronde];
  document.getElementById('ronde-mult').textContent = 'XP ×' + getXpMultiplier();

  renderLevelDots();
  renderLevels();
  renderBadges();
  renderLeaderboard();
  checkBadges();
}

// ============================================================
// LEVEL DOTS
// ============================================================
function renderLevelDots() {
  const container = document.getElementById('level-dots');
  container.innerHTML = '';
  const allLevels = getAllLevels();
  allLevels.forEach((level, idx) => {
    const unlocked = isLevelUnlocked(level.id);
    const done = isLevelDone(level.id);
    const isBoss = level.id === 8;
    const isActive = unlocked && !done;

    const wrap = document.createElement('div');
    wrap.className = 'level-dot-wrap';

    if (idx > 0) {
      const conn = document.createElement('div');
      conn.className = 'level-connector' + (isLevelDone(allLevels[idx-1].id) ? ' done' : '');
      wrap.appendChild(conn);
    }

    const dot = document.createElement('div');
    dot.className = 'level-dot' + (done ? ' done' : isActive ? ' active' : '') + (isBoss ? ' boss' : '');
    dot.textContent = done ? '✓' : isBoss ? '⚔' : level.id;
    dot.title = level.naam;
    dot.onclick = () => scrollToLevel(level.id);

    const label = document.createElement('div');
    label.className = 'level-dot-label';
    label.textContent = isBoss ? 'Boss' : 'Les ' + level.id;

    wrap.appendChild(dot);
    wrap.appendChild(label);
    container.appendChild(wrap);
  });
}

function scrollToLevel(id) {
  const el = document.getElementById('level-card-' + id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ============================================================
// LEVELS
// ============================================================
function renderLevels() {
  const container = document.getElementById('levels-list');
  container.innerHTML = '';
  const allLevels = getAllLevels();
  const rondeTag = RONDE_TAGS[STATE.ronde];

  allLevels.forEach(level => {
    const unlocked = isLevelUnlocked(level.id);
    const done = isLevelDone(level.id);
    const isBoss = level.id === 8;
    const isOpen = STATE.openLevels.includes(level.id);

    const card = document.createElement('div');
    card.id = 'level-card-' + level.id;
    card.className = 'level-card' +
      (unlocked && !done ? ' active-level' : '') +
      (!unlocked ? ' locked-level' : '') +
      (isBoss ? ' boss-level' : '');

    const lessenDone = level.lessen.filter(l => getLesVoltooid(l.id)).length;
    const allLessenDone = lessenDone === level.lessen.length;
    const iconClass = done ? 'done' : isBoss ? 'boss' : 'normal';
    const iconText = done ? '✓' : isBoss ? '⚔️' : level.id;
    const xpWaarde = Math.round(CONFIG.xpPerLes * getXpMultiplier() * level.lessen.length);

    card.innerHTML = `
      <div class="level-header" onclick="toggleLevel(${level.id})">
        <div class="level-header-left">
          <div class="level-icon ${iconClass}">${iconText}</div>
          <div>
            <div class="level-title">${!unlocked ? '🔒 ' : ''}${level.naam}</div>
            <div class="level-desc">${level.omschrijving}</div>
          </div>
        </div>
        <div class="level-header-right">
          <span class="level-badge ${rondeTag}">${RONDE_NAMES[STATE.ronde]}</span>
          <span class="level-xp">⚡ +${xpWaarde} XP</span>
          <span class="level-chevron ${isOpen ? 'open' : ''}">▶</span>
        </div>
      </div>
      <div class="level-body ${isOpen ? 'open' : ''}" id="level-body-${level.id}">
        <div class="lessons-grid">
          ${level.lessen.map(les => renderLesItem(les, unlocked)).join('')}
        </div>
        ${renderGatekeeper(level, unlocked, allLessenDone, done)}
      </div>
    `;

    container.appendChild(card);
  });
}

function renderLesItem(les, unlocked) {
  const done = getLesVoltooid(les.id);
  const xp = Math.round(CONFIG.xpPerLes * getXpMultiplier());
  const rondeTag = RONDE_TAGS[STATE.ronde];
  return `
    <div class="lesson-item ${done ? 'done-lesson' : ''}" onclick="${unlocked ? `openLes('${les.id}')` : ''}">
      <div class="lesson-label ${les.label.toLowerCase()}">${les.label === 'A' ? 'LES A' : 'LES B'}</div>
      <div class="lesson-title">${les.naam}</div>
      <div class="lesson-desc">${les.omschrijving}</div>
      <div class="lesson-meta">
        <span class="lesson-tag ${rondeTag}">${RONDE_NAMES[STATE.ronde]}</span>
        <span class="lesson-xp">⚡ ${xp} XP</span>
        <span class="lesson-time">${les.tijdsduur || '15 min'}</span>
      </div>
      <div class="lesson-check ${done ? 'done' : ''}">${done ? '✓' : ''}</div>
    </div>
  `;
}

function renderGatekeeper(level, unlocked, allLessenDone, done) {
  if (done) {
    return `<div class="gatekeeper-bar">
      <div class="gatekeeper-info passed">✅ Gatekeeper gepasseerd</div>
      <span class="gatekeeper-score">GESLAAGD</span>
    </div>`;
  }
  if (!unlocked) {
    return `<div class="gatekeeper-bar">
      <div class="gatekeeper-info locked">🔒 Gatekeeper: voltooi eerst beide lessen</div>
      <span style="font-size:0.7rem;color:var(--muted)">○ Les A &nbsp; ○ Les B</span>
    </div>`;
  }
  if (!allLessenDone) {
    const done1 = getLesVoltooid(level.lessen[0].id);
    const done2 = getLesVoltooid(level.lessen[1].id);
    return `<div class="gatekeeper-bar">
      <div class="gatekeeper-info locked">🔒 Gatekeeper: voltooi eerst beide lessen</div>
      <span style="font-size:0.7rem;color:var(--muted)">${done1 ? '✓' : '○'} Les A &nbsp; ${done2 ? '✓' : '○'} Les B</span>
    </div>`;
  }
  return `<div class="gatekeeper-bar">
    <div class="gatekeeper-info ready">🔐 Gatekeeper klaar — haal min. ${CONFIG.gatekeeperMinScore}%</div>
    <button class="gatekeeper-btn" onclick="openGatekeeper(${level.id})">🔓 Gatekeeper starten</button>
  </div>`;
}

function toggleLevel(id) {
  const idx = STATE.openLevels.indexOf(id);
  if (idx >= 0) STATE.openLevels.splice(idx, 1);
  else STATE.openLevels.push(id);
  saveState();
  renderApp();
}

// ============================================================
// LES MODAL
// ============================================================
function openLes(lesId) {
  const allLevels = getAllLevels();
  let les = null;
  for (const level of allLevels) {
    les = level.lessen.find(l => l.id === lesId);
    if (les) break;
  }
  if (!les) return;

  currentLesData = les;
  currentQuizAnswers = {};

  document.getElementById('modal-les-title').textContent = les.naam;

  const done = getLesVoltooid(les.id);
  const xp = Math.round(CONFIG.xpPerLes * getXpMultiplier());

  let quizHTML = '';
  if (les.quizVragen && les.quizVragen.length > 0) {
    quizHTML = `<div class="quiz-section">
      <div class="quiz-title">🎯 Snelle Check — ${les.quizVragen.length} ${les.quizVragen.length === 1 ? 'vraag' : 'vragen'}</div>
      ${les.quizVragen.map((q, qi) => `
        <div class="quiz-question" id="quiz-q-${qi}">
          <div class="quiz-q-text">${qi + 1}. ${q.vraag}</div>
          <div class="quiz-options">
            ${q.opties.map((opt, oi) => `
              <button class="quiz-option" onclick="answerQuiz(${qi}, ${oi}, ${q.juist})" id="quiz-opt-${qi}-${oi}">${opt}</button>
            `).join('')}
          </div>
        </div>
      `).join('')}
    </div>`;
  } else {
    quizHTML = `<div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:1rem;text-align:center;color:var(--muted);font-size:0.85rem;">Geen quiz ingesteld voor deze les.</div>`;
  }

  document.getElementById('modal-les-body').innerHTML = `
    <div class="lesson-modal-label">${les.label === 'A' ? 'LES A' : 'LES B'} · ⚡ ${xp} XP</div>
    <div class="lesson-modal-title">${les.naam}</div>
    <div class="lesson-modal-desc">${les.omschrijving}</div>
    ${les.activiteit ? `
      <div class="activity-box">
        <div class="activity-box-title">📌 Activiteit</div>
        <div class="activity-name">${les.activiteit}</div>
        ${les.activiteitSub ? `<div class="activity-sub">${les.activiteitSub}</div>` : ''}
      </div>
    ` : `
      <div class="activity-box">
        <div class="activity-box-title">📌 Activiteit</div>
        <div style="color:var(--muted);font-size:0.85rem;">Geen activiteit ingesteld. Gebruik het leerkrachtpaneel.</div>
      </div>
    `}
    ${quizHTML}
  `;

  const doneBtn = document.getElementById('modal-done-btn');
  if (done) {
    doneBtn.textContent = '✅ Al voltooid';
    doneBtn.disabled = true;
  } else {
    doneBtn.textContent = '✅ Les markeren als voltooid';
    doneBtn.disabled = false;
  }

  document.getElementById('les-modal').classList.remove('hidden');
}

function answerQuiz(qi, oi, juist) {
  if (currentQuizAnswers[qi] !== undefined) return;
  currentQuizAnswers[qi] = oi;

  const opts = document.querySelectorAll(`#quiz-q-${qi} .quiz-option`);
  opts.forEach((btn, idx) => {
    btn.disabled = true;
    if (idx === juist) btn.classList.add('correct');
    else if (idx === oi && oi !== juist) btn.classList.add('wrong');
  });
}

function markLesVoltooid() {
  if (!currentLesData) return;
  if (!STATE.voltooideIds.includes(currentLesData.id)) {
    STATE.voltooideIds.push(currentLesData.id);
    const xp = Math.round(CONFIG.xpPerLes * getXpMultiplier());
    saveState();
    showToast(`+${xp} XP — Les voltooid! 🎉`, 'success');
  }
  closeModal('les-modal');
  renderApp();
}

// ============================================================
// GATEKEEPER
// ============================================================
function openGatekeeper(levelId) {
  const allLevels = getAllLevels();
  const level = allLevels.find(l => l.id === levelId);
  if (!level) return;

  // Collect all quiz questions from both lessons
  const allVragen = level.lessen.flatMap(les => les.quizVragen || []);

  if (allVragen.length === 0) {
    // No questions — auto pass
    passGatekeeper(levelId);
    return;
  }

  let gateAnswers = {};

  const body = document.getElementById('gate-modal-body');
  body.innerHTML = `
    <p style="font-size:0.85rem;color:var(--muted);margin-bottom:1.25rem;">Haal minimum <strong style="color:var(--gold)">${CONFIG.gatekeeperMinScore}%</strong> om door te gaan naar het volgende level.</p>
    ${allVragen.map((q, qi) => `
      <div class="quiz-question" id="gate-q-${qi}">
        <div class="quiz-q-text">${qi + 1}. ${q.vraag}</div>
        <div class="quiz-options">
          ${q.opties.map((opt, oi) => `
            <button class="quiz-option" onclick="answerGate(${qi}, ${oi}, ${q.juist}, ${allVragen.length}, ${levelId})" id="gate-opt-${qi}-${oi}">${opt}</button>
          `).join('')}
        </div>
      </div>
    `).join('')}
  `;

  document.getElementById('gate-modal-footer').innerHTML = `<button class="btn-secondary" onclick="closeModal('gate-modal')">Annuleren</button>`;
  document.getElementById('gate-modal').classList.remove('hidden');

  window._gateAnswers = {};
  window._gateLevelId = levelId;
  window._gateTotal = allVragen.length;
  window._gateVragen = allVragen;
}

function answerGate(qi, oi, juist, total, levelId) {
  if (window._gateAnswers[qi] !== undefined) return;
  window._gateAnswers[qi] = oi;

  const opts = document.querySelectorAll(`#gate-q-${qi} .quiz-option`);
  opts.forEach((btn, idx) => {
    btn.disabled = true;
    if (idx === juist) btn.classList.add('correct');
    else if (idx === oi && oi !== juist) btn.classList.add('wrong');
  });

  if (Object.keys(window._gateAnswers).length === total) {
    // All answered — calculate score
    setTimeout(() => showGateResult(levelId), 600);
  }
}

function showGateResult(levelId) {
  const vragen = window._gateVragen;
  let correct = 0;
  vragen.forEach((q, qi) => {
    if (window._gateAnswers[qi] === q.juist) correct++;
  });
  const score = Math.round(correct / vragen.length * 100);
  const passed = score >= CONFIG.gatekeeperMinScore;

  const body = document.getElementById('gate-modal-body');
  body.innerHTML = `
    <div class="gate-score-big ${passed ? 'pass' : 'fail'}">${score}%</div>
    <div class="gate-result-text">${correct} van ${vragen.length} correct</div>
    <p style="text-align:center;font-size:0.9rem;color:${passed ? 'var(--green)' : 'var(--red)'}">
      ${passed ? '🎉 Geslaagd! Je mag door naar het volgende level.' : `❌ Niet geslaagd. Je hebt minimum ${CONFIG.gatekeeperMinScore}% nodig.`}
    </p>
  `;

  const footer = document.getElementById('gate-modal-footer');
  if (passed) {
    footer.innerHTML = `<button class="btn-primary" onclick="passGatekeeper(${levelId})">Volgende Level ▶</button>`;
  } else {
    footer.innerHTML = `<button class="btn-secondary" onclick="closeModal('gate-modal')">Opnieuw proberen</button>`;
  }
}

function passGatekeeper(levelId) {
  if (!STATE.gatekeeperPassed.includes(levelId)) {
    STATE.gatekeeperPassed.push(levelId);
    // Check if Big Boss passed → start new ronde
    if (levelId === 8 && STATE.ronde < 2) {
      STATE.ronde++;
      STATE.voltooideIds = [];
      STATE.gatekeeperPassed = [];
      saveState();
      closeModal('gate-modal');
      showToast(`🌟 Ronde ${RONDE_NAMES[STATE.ronde]} gestart! XP ×${getXpMultiplier()}`, 'info');
      renderApp();
      return;
    }
    saveState();
  }
  closeModal('gate-modal');
  showToast('🎉 Level gepasseerd!', 'success');
  renderApp();
}

// ============================================================
// MODAL
// ============================================================
function closeModal(id) {
  document.getElementById(id).classList.add('hidden');
  currentLesData = null;
}

// ============================================================
// TABS
// ============================================================
function switchTab(tab) {
  ['lessen', 'badges', 'leaderboard'].forEach(t => {
    document.getElementById('view-' + t).style.display = t === tab ? 'block' : 'none';
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
  });
}

// ============================================================
// BADGES
// ============================================================
function checkBadges() {
  const done = getVoltooideCount();
  const levDone = STATE.gatekeeperPassed.length;
  const allDone = done === getTotalLessen();

  CONFIG.badges.forEach(badge => {
    if (STATE.badges.includes(badge.id)) return;
    let earned = false;
    if (badge.trigger === 'les_count' && done >= badge.waarde) earned = true;
    if (badge.trigger === 'level_done' && levDone >= badge.waarde) earned = true;
    if (badge.trigger === 'boss_done' && STATE.gatekeeperPassed.includes(8)) earned = true;
    if (badge.trigger === 'ronde' && STATE.ronde >= badge.waarde - 1) earned = true;
    if (badge.trigger === 'all_done' && allDone) earned = true;
    if (earned) {
      STATE.badges.push(badge.id);
      saveState();
      showToast(`🏅 Badge verdiend: ${badge.naam}!`, 'info');
    }
  });
}

function renderBadges() {
  const grid = document.getElementById('badges-grid');
  grid.innerHTML = CONFIG.badges.map(badge => {
    const earned = STATE.badges.includes(badge.id);
    return `<div class="badge-card ${earned ? 'earned' : 'locked-badge'}">
      <div class="badge-emoji">${badge.emoji}</div>
      <div class="badge-name">${badge.naam}</div>
      <div class="badge-desc">${badge.beschrijving}</div>
    </div>`;
  }).join('');
}

// ============================================================
// LEADERBOARD
// ============================================================
function renderLeaderboard() {
  const container = document.getElementById('leaderboard-list');
  const myXP = getTotalXP();
  const myEntry = { naam: STATE.naam, klas: STATE.klas, xp: myXP, isMe: true };

  // Load others from localStorage
  let others = [];
  try {
    const lb = localStorage.getItem('vakcore_leaderboard');
    if (lb) others = JSON.parse(lb);
  } catch(e) {}

  // Update my entry
  others = others.filter(e => e.naam !== STATE.naam);
  others.push({ naam: STATE.naam, klas: STATE.klas, xp: myXP });
  localStorage.setItem('vakcore_leaderboard', JSON.stringify(others));

  const sorted = [...others].sort((a, b) => b.xp - a.xp).slice(0, 10);
  const rankClasses = ['gold', 'silver', 'bronze'];

  if (sorted.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🏆</div><div class="empty-state-text">Nog geen scores</div></div>`;
    return;
  }

  container.innerHTML = sorted.map((entry, idx) => `
    <div class="lb-item ${entry.naam === STATE.naam ? 'me' : ''}">
      <div class="lb-rank ${rankClasses[idx] || ''}">${idx + 1}</div>
      <div class="lb-avatar">${entry.naam[0]?.toUpperCase() || '?'}</div>
      <div class="lb-name">${entry.naam} <span style="font-size:0.7rem;color:var(--muted)">${entry.klas ? '· ' + entry.klas : ''}</span></div>
      <div class="lb-xp">⚡ ${entry.xp} XP</div>
    </div>
  `).join('');
}

// ============================================================
// INIT
// ============================================================
loadConfig();
loadState();

document.getElementById('splash-title').textContent = CONFIG.titel;
document.getElementById('splash-org').textContent = CONFIG.ondertitel;

if (STATE.naam) {
  enterApp();
}

document.getElementById('input-naam').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('input-klas').focus();
});
document.getElementById('input-klas').addEventListener('keydown', e => {
  if (e.key === 'Enter') startLeerpad();
});
</script>
</body>
