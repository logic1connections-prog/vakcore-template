<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ VAKCORE — Leerpad Builder</title>
<style>
:root {
  --bg: #0b0f19;
  --bg2: #111827;
  --bg3: #1f2937;
  --purple: #B100FF;
  --pink: #FF2EB3;
  --blue: #00AFFF;
  --cyan: #00e5cc;
  --gold: #f59e0b;
  --red: #dc2626;
  --green: #10b981;
  --text: #e2e8f0;
  --muted: #64748b;
  --border: #000;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Courier New', Courier, monospace;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 1.5rem;
  user-select: none;
}

/* HEADER */
.header {
  border: 4px solid #000;
  background: var(--bg2);
  padding: 1.25rem 1.5rem;
  margin-bottom: 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
  box-shadow: 6px 6px 0 #000;
}
.header-title { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; }
.header-title span { color: var(--blue); }
.header-sub { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 0.25rem; }
.gatekeeper-badge {
  background: var(--red); border: 4px solid #000;
  padding: 0.4rem 0.9rem; font-weight: 900; font-size: 0.7rem;
  text-transform: uppercase; box-shadow: 3px 3px 0 #000; cursor: pointer;
  transition: transform 0.1s;
}
.gatekeeper-badge:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 #000; }

/* LAYOUT */
.main-grid {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 1.5rem;
  align-items: start;
}
@media(max-width:900px) { .main-grid { grid-template-columns: 1fr; } }

/* SIDEBAR */
.sidebar {
  border: 4px solid #000;
  background: var(--bg2);
  padding: 1rem;
  box-shadow: 4px 4px 0 #000;
  position: sticky;
  top: 1.5rem;
}
.sidebar-title {
  font-size: 0.75rem; font-weight: 900; text-transform: uppercase;
  color: var(--purple); border-bottom: 4px solid #000; padding-bottom: 0.5rem;
  margin-bottom: 0.75rem; letter-spacing: 0.1em;
}
.activity-item {
  border: 2px solid #000;
  background: var(--bg3);
  padding: 0.6rem 0.75rem;
  margin-bottom: 0.4rem;
  font-size: 0.75rem;
  font-weight: 700;
  cursor: grab;
  box-shadow: 2px 2px 0 #000;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
}
.activity-item:hover { background: #374151; transform: translate(-1px,-1px); box-shadow: 3px 3px 0 #000; }
.activity-item.dragging { opacity: 0.4; cursor: grabbing; }
.activity-item.selected {
  border-color: var(--blue) !important;
  box-shadow: 0 0 12px var(--blue), 2px 2px 0 #000 !important;
  background: #0d1a30 !important;
}
.del-btn {
  background: none; border: none; color: var(--muted);
  cursor: pointer; font-size: 0.9rem; padding: 0 0.2rem;
  line-height: 1;
}
.del-btn:hover { color: var(--red); }
.add-activity-row {
  display: flex; gap: 0.4rem; margin-top: 0.75rem;
}
.add-input {
  flex: 1; background: var(--bg3); border: 2px solid #000;
  color: var(--text); font-family: inherit; font-size: 0.7rem;
  padding: 0.4rem 0.5rem; outline: none;
}
.add-input:focus { border-color: var(--blue); }
.add-btn {
  background: var(--purple); border: 2px solid #000;
  color: #fff; font-weight: 900; font-size: 0.75rem;
  padding: 0.4rem 0.6rem; cursor: pointer; box-shadow: 2px 2px 0 #000;
}
.add-btn:hover { background: #9000d4; }

/* LESSONS GRID */
.lessons-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1rem;
}
@media(max-width:600px) { .lessons-grid { grid-template-columns: 1fr; } }

/* LESSON CARD */
.lesson-card {
  border: 4px solid #000;
  background: var(--bg2);
  padding: 0.75rem;
  box-shadow: 4px 4px 0 #000;
  transition: opacity 0.2s;
}
.lesson-card.locked { opacity: 0.55; }
.lesson-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 0.6rem;
}
.lesson-badge {
  background: var(--purple); border: 2px solid #000;
  font-size: 0.65rem; font-weight: 900; padding: 0.2rem 0.5rem;
  text-transform: uppercase; letter-spacing: 0.05em;
  box-shadow: 2px 2px 0 #000;
}
.lock-btn {
  font-size: 0.65rem; font-weight: 900; padding: 0.2rem 0.5rem;
  border: 2px solid #000; cursor: pointer; text-transform: uppercase;
  box-shadow: 2px 2px 0 #000; transition: all 0.1s;
}
.lock-btn.unlocked { background: var(--cyan); color: #000; }
.lock-btn.locked { background: #374151; color: var(--muted); }
.lock-btn:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 #000; }

/* SLOTS */
.slots-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
.slot {
  border: 2px dashed #374151;
  min-height: 64px;
  padding: 0.4rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  cursor: pointer;
  position: relative;
}
.slot-label {
  font-size: 0.6rem; font-weight: 900; text-transform: uppercase;
  letter-spacing: 0.1em; margin-bottom: 0.3rem;
}
.slot-1 .slot-label { color: var(--cyan); }
.slot-2 .slot-label { color: var(--pink); }
.slot-1 { border-color: #1a3a3a; }
.slot-2 { border-color: #3a1a2a; }
.slot.drag-over { border-style: solid; border-color: var(--blue); background: #0d1a30; box-shadow: 0 0 10px var(--blue); }
.slot.has-item { border-style: solid; cursor: default; }
.slot-1.has-item { border-color: var(--cyan); background: #001a1a; }
.slot-2.has-item { border-color: var(--pink); background: #1a001a; }
.slot-empty-hint { font-size: 0.65rem; color: #374151; text-align: center; }
.slot-content { font-size: 0.7rem; font-weight: 700; text-align: center; line-height: 1.3; }
.slot-1.has-item .slot-content { color: var(--cyan); }
.slot-2.has-item .slot-content { color: var(--pink); }
.clear-btn {
  font-size: 0.6rem; color: var(--gold); background: none; border: none;
  cursor: pointer; text-decoration: underline; margin-top: 0.2rem;
  font-family: inherit; font-weight: 700;
}
.clear-btn:hover { color: var(--red); }

/* CLICK HINT */
.click-hint {
  font-size: 0.6rem; color: var(--muted); text-align: center;
  margin-top: 0.4rem; letter-spacing: 0.05em;
}

/* JSON OUTPUT */
.json-section {
  margin-top: 1.5rem;
  border: 4px solid #000;
  background: var(--bg2);
  box-shadow: 4px 4px 0 #000;
}
.json-toggle {
  width: 100%; background: var(--bg3); border: none; border-bottom: 4px solid #000;
  color: var(--text); font-family: inherit; font-size: 0.75rem; font-weight: 900;
  text-transform: uppercase; padding: 0.6rem 1rem; cursor: pointer; text-align: left;
  letter-spacing: 0.1em;
}
.json-toggle:hover { background: #374151; }
.json-output {
  display: none; padding: 1rem; font-size: 0.7rem; color: var(--cyan);
  white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto;
  line-height: 1.6;
}
.json-output.open { display: block; }

/* SELECTED INDICATOR */
.selected-indicator {
  position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
  background: var(--blue); border: 3px solid #000; padding: 0.5rem 1.25rem;
  font-weight: 900; font-size: 0.8rem; text-transform: uppercase;
  box-shadow: 4px 4px 0 #000; color: #000; letter-spacing: 0.05em;
  pointer-events: none; opacity: 0; transition: opacity 0.2s;
  z-index: 999;
}
.selected-indicator.visible { opacity: 1; }

/* SAVE NOTICE */
.save-notice {
  position: fixed; top: 1rem; right: 1rem;
  background: var(--green); border: 3px solid #000;
  padding: 0.4rem 0.9rem; font-weight: 900; font-size: 0.75rem;
  box-shadow: 3px 3px 0 #000; color: #000; opacity: 0;
  transition: opacity 0.3s; z-index: 999;
}
.save-notice.show { opacity: 1; }
</style>
</head>
<body>

<div class="save-notice" id="save-notice">💾 OPGESLAGEN</div>
<div class="selected-indicator" id="selected-indicator">📌 GESELECTEERD — Klik een vakje</div>

<!-- HEADER -->
<header class="header">
  <div>
    <div class="header-title">⚡ VAKCORE <span>LEERPAD BUILDER</span></div>
    <div class="header-sub">Sleep activiteiten naar de vakjes — of klik eerst een activiteit, dan een vakje</div>
  </div>
  <button class="gatekeeper-badge" onclick="toggleAllLocks()">🛡️ GATEKEEPER GUARD ACTIVE</button>
</header>

<!-- MAIN -->
<div class="main-grid">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-title">🗂️ Activiteiten</div>
    <div id="items-list"></div>
    <div class="add-activity-row">
      <input class="add-input" id="new-activity-input" placeholder="Nieuwe activiteit..." maxlength="40">
      <button class="add-btn" onclick="addActivity()">+ ADD</button>
    </div>
    <div style="margin-top:1rem;border-top:2px solid #1f2937;padding-top:0.75rem;">
      <button onclick="resetAll()" style="width:100%;background:#1f2937;border:2px solid #000;color:#ef4444;font-family:inherit;font-size:0.7rem;font-weight:900;padding:0.4rem;cursor:pointer;text-transform:uppercase;box-shadow:2px 2px 0 #000;">🗑️ Alles wissen</button>
    </div>
  </div>

  <!-- LESSONS -->
  <div>
    <div class="lessons-grid" id="lessons-grid"></div>

    <!-- JSON -->
    <div class="json-section">
      <button class="json-toggle" onclick="toggleJson()">📋 JSON Output (klik om te tonen/verbergen)</button>
      <pre class="json-output" id="json-output"></pre>
    </div>
  </div>

</div>

<script>
// ============================================================
// STATE
// ============================================================
let STATE = {
  lessen: Array.from({length: 8}, (_, i) => ({
    id: i + 1,
    titel: `Les ${i + 1}`,
    v1: null,
    v2: null,
    unlocked: i === 0
  })),
  activiteiten: [
    "📺 Filmpje: 10 Tools",
    "📐 Bart & De Schuifmaat",
    "🎧 Podcast Missie",
    "🔍 Zoek de 5 Fouten",
    "🛠️ Veiligheid VIK Kaart",
    "⚙️ Kolomboor Check",
    "⚔️ Smashers / Cutters",
    "🛡️ Safety PBM Check"
  ],
  selectedActivity: null,
  dragActivity: null
};

// ============================================================
// PERSISTENCE
// ============================================================
function saveState() {
  localStorage.setItem('vakcore_drag_state', JSON.stringify({
    lessen: STATE.lessen,
    activiteiten: STATE.activiteiten
  }));
  showSaveNotice();
}

function loadState() {
  const saved = localStorage.getItem('vakcore_drag_state');
  if (saved) {
    const parsed = JSON.parse(saved);
    STATE.lessen = parsed.lessen || STATE.lessen;
    STATE.activiteiten = parsed.activiteiten || STATE.activiteiten;
  }
}

function showSaveNotice() {
  const el = document.getElementById('save-notice');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1500);
}

// ============================================================
// RENDER SIDEBAR
// ============================================================
function renderSidebar() {
  const list = document.getElementById('items-list');
  list.innerHTML = '';
  STATE.activiteiten.forEach((act, idx) => {
    const div = document.createElement('div');
    div.className = 'activity-item' + (STATE.selectedActivity === act ? ' selected' : '');
    div.draggable = true;
    div.dataset.activity = act;
    div.innerHTML = `<span>${act}</span><button class="del-btn" onclick="deleteActivity(${idx})" title="Verwijderen">✕</button>`;

    // Click to select
    div.addEventListener('click', (e) => {
      if (e.target.classList.contains('del-btn')) return;
      if (STATE.selectedActivity === act) {
        STATE.selectedActivity = null;
      } else {
        STATE.selectedActivity = act;
      }
      updateSelectedIndicator();
      renderSidebar();
    });

    // Drag start
    div.addEventListener('dragstart', (e) => {
      STATE.dragActivity = act;
      div.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'copy';
      e.dataTransfer.setData('text/plain', act);
    });
    div.addEventListener('dragend', () => {
      STATE.dragActivity = null;
      div.classList.remove('dragging');
    });

    list.appendChild(div);
  });
}

function updateSelectedIndicator() {
  const el = document.getElementById('selected-indicator');
  if (STATE.selectedActivity) {
    el.textContent = `📌 ${STATE.selectedActivity} — Klik een vakje`;
    el.classList.add('visible');
  } else {
    el.classList.remove('visible');
  }
}

// ============================================================
// RENDER LESSONS
// ============================================================
function renderLessons() {
  const grid = document.getElementById('lessons-grid');
  grid.innerHTML = '';
  STATE.lessen.forEach((les, lesIdx) => {
    const card = document.createElement('div');
    card.className = 'lesson-card' + (les.unlocked ? '' : ' locked');

    card.innerHTML = `
      <div class="lesson-header">
        <span class="lesson-badge">LES ${les.id}</span>
        <button class="lock-btn ${les.unlocked ? 'unlocked' : 'locked'}" onclick="toggleLock(${lesIdx})">
          ${les.unlocked ? '🔓 UNLOCKED' : '🔒 LOCKED'}
        </button>
      </div>
      <div class="slots-row">
        ${renderSlot(les, lesIdx, 'v1', 1)}
        ${renderSlot(les, lesIdx, 'v2', 2)}
      </div>
      <div class="click-hint">Sleep een activiteit hier naartoe, of klik eerst een activiteit dan dit vakje</div>
    `;

    // Add drag-and-drop listeners to slots after inserting HTML
    grid.appendChild(card);

    const slots = card.querySelectorAll('.slot');
    slots.forEach((slot, slotIdx) => {
      const slotKey = slotIdx === 0 ? 'v1' : 'v2';

      slot.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
        slot.classList.add('drag-over');
      });
      slot.addEventListener('dragleave', () => slot.classList.remove('drag-over'));
      slot.addEventListener('drop', (e) => {
        e.preventDefault();
        slot.classList.remove('drag-over');
        const act = e.dataTransfer.getData('text/plain') || STATE.dragActivity;
        if (act && les.unlocked) {
          STATE.lessen[lesIdx][slotKey] = act;
          saveState();
          renderAll();
        }
      });

      // Click to fill (when activity selected)
      slot.addEventListener('click', () => {
        if (!les.unlocked) return;
        if (STATE.selectedActivity && !STATE.lessen[lesIdx][slotKey]) {
          STATE.lessen[lesIdx][slotKey] = STATE.selectedActivity;
          STATE.selectedActivity = null;
          updateSelectedIndicator();
          saveState();
          renderAll();
        }
      });
    });
  });

  updateJson();
}

function renderSlot(les, lesIdx, key, num) {
  const val = les[key];
  const colorClass = `slot-${num}`;
  const hasItem = val ? ' has-item' : '';
  if (val) {
    return `
      <div class="slot ${colorClass}${hasItem}">
        <div class="slot-label">Vakje ${num}</div>
        <div class="slot-content">${val}</div>
        <button class="clear-btn" onclick="clearSlot(${lesIdx},'${key}')">⚠️ Wissen</button>
      </div>`;
  } else {
    return `
      <div class="slot ${colorClass}" data-les="${lesIdx}" data-key="${key}">
        <div class="slot-label">Vakje ${num}</div>
        <div class="slot-empty-hint">KLIK HIER</div>
      </div>`;
  }
}

// ============================================================
// ACTIONS
// ============================================================
function clearSlot(lesIdx, key) {
  STATE.lessen[lesIdx][key] = null;
  saveState();
  renderAll();
}

function toggleLock(lesIdx) {
  STATE.lessen[lesIdx].unlocked = !STATE.lessen[lesIdx].unlocked;
  saveState();
  renderAll();
}

function toggleAllLocks() {
  const anyUnlocked = STATE.lessen.some(l => l.unlocked);
  STATE.lessen.forEach(l => l.unlocked = !anyUnlocked);
  saveState();
  renderAll();
}

function addActivity() {
  const input = document.getElementById('new-activity-input');
  const val = input.value.trim();
  if (!val) return;
  STATE.activiteiten.push(val);
  input.value = '';
  saveState();
  renderSidebar();
}

function deleteActivity(idx) {
  const act = STATE.activiteiten[idx];
  if (STATE.selectedActivity === act) {
    STATE.selectedActivity = null;
    updateSelectedIndicator();
  }
  STATE.activiteiten.splice(idx, 1);
  saveState();
  renderSidebar();
}

function resetAll() {
  if (!confirm('Alles wissen? Dit verwijdert alle activiteiten uit de vakjes.')) return;
  STATE.lessen.forEach(l => { l.v1 = null; l.v2 = null; });
  saveState();
  renderAll();
}

// ============================================================
// JSON
// ============================================================
function updateJson() {
  const output = {
    leerpad: "VakCore",
    lessen: STATE.lessen.map(l => ({
      id: l.id,
      titel: l.titel,
      vakje1: l.v1,
      vakje2: l.v2,
      unlocked: l.unlocked
    }))
  };
  document.getElementById('json-output').textContent = JSON.stringify(output, null, 2);
}

function toggleJson() {
  document.getElementById('json-output').classList.toggle('open');
}

// ============================================================
// ENTER KEY for add activity
// ============================================================
document.getElementById('new-activity-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addActivity();
});

// ============================================================
// INIT
// ============================================================
function renderAll() {
  renderSidebar();
  renderLessons();
}

loadState();
renderAll();
</script>
</body>
</html>
